<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS1 General Mathematics — Interactive Workbook</title>
<style>
  :root{
    --paper:#FBF7EC;
    --paper-line:#CBDCEB;
    --ink:#1B2A4A;
    --ink-soft:#3D4E74;
    --navy:#16233F;
    --gold:#D8A11E;
    --gold-dim:#F1DFAE;
    --teal:#0F6E64;
    --teal-dim:#DCEFEC;
    --red:#B3401E;
    --white:#FFFFFF;
    --shadow: 0 2px 10px rgba(22,35,63,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family: "Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    min-height:100vh;
  }
  ::selection{background:var(--gold-dim);}
  a{color:var(--teal);}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:300px;
    flex-shrink:0;
    background:var(--navy);
    color:#EFE9DA;
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
  }
  #brand{
    padding:20px 20px 14px 20px;
    border-bottom:1px solid rgba(255,255,255,0.12);
  }
  #brand .kicker{
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
  }
  #brand h1{
    font-size:20px;
    margin:6px 0 2px 0;
    line-height:1.25;
    font-weight:700;
  }
  #brand .sub{
    font-size:12px;
    color:#B9C2D6;
  }
  #term-tabs{
    display:flex;
    gap:0;
    padding:10px 12px 0 12px;
  }
  .term-tab{
    flex:1;
    background:transparent;
    border:1px solid rgba(255,255,255,0.18);
    color:#CDD5E6;
    padding:8px 4px;
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    letter-spacing:0.5px;
    cursor:pointer;
    border-radius:3px;
    margin:2px;
    transition:all .15s ease;
  }
  .term-tab:hover{border-color:var(--gold);color:var(--gold-dim);}
  .term-tab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--navy);
    font-weight:700;
  }
  #topic-list{
    list-style:none;
    margin:0;
    padding:10px 10px 20px 10px;
    overflow-y:auto;
    flex:1;
  }
  #topic-list li{margin-bottom:3px;}
  .topic-btn{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:#CDD5E6;
    padding:10px 12px;
    font-family:inherit;
    font-size:13.5px;
    cursor:pointer;
    border-radius:3px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    line-height:1.35;
  }
  .topic-btn .num{
    font-family:"Consolas","Courier New",monospace;
    color:var(--gold);
    font-size:11px;
    flex-shrink:0;
    padding-top:1px;
  }
  .topic-btn:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .topic-btn.active{
    background:rgba(216,161,30,0.16);
    color:#fff;
    box-shadow:inset 3px 0 0 var(--gold);
    font-weight:700;
  }
  #sidebar-foot{
    padding:12px 20px;
    font-size:10.5px;
    color:#7F8CA8;
    border-top:1px solid rgba(255,255,255,0.12);
    font-family:"Consolas","Courier New",monospace;
  }

  /* ---------- Main content: exercise book page ---------- */
  #main{
    flex:1;
    min-width:0;
    padding:36px 44px 80px 44px;
    background-image:
      repeating-linear-gradient(var(--paper) 0 31px, var(--paper-line) 31px 32px);
    background-position: 0 90px;
  }
  #page{
    max-width:920px;
    margin:0 auto;
    background:var(--paper);
    position:relative;
    padding-left:36px;
    border-left:2px solid var(--red);
  }
  #page::before{
    content:"";
    position:absolute;
    left:-2px; top:0; bottom:0;
    width:2px;
  }
  .eyebrow{
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:6px;
  }
  h2.topic-title{
    font-size:32px;
    margin:0 0 6px 0;
    color:var(--navy);
    line-height:1.15;
  }
  .summary{
    font-size:16px;
    color:var(--ink-soft);
    max-width:70ch;
    margin-bottom:22px;
  }
  section.block{margin:26px 0;}
  h3.block-title{
    font-size:17px;
    color:var(--navy);
    border-bottom:2px solid var(--navy);
    display:inline-block;
    padding-bottom:2px;
    margin:0 0 12px 0;
  }
  .prose p{margin:0 0 10px 0; font-size:15px; line-height:1.65;}
  .prose ul, .prose ol{font-size:15px; line-height:1.6; padding-left:22px;}
  .prose strong{color:var(--navy);}

  /* glossary */
  dl.glossary{
    background:var(--white);
    border:1px dashed var(--gold);
    border-radius:6px;
    padding:14px 18px;
    margin:0;
  }
  dl.glossary dt{
    font-weight:700;
    color:var(--navy);
    font-size:14.5px;
    margin-top:8px;
  }
  dl.glossary dt:first-child{margin-top:0;}
  dl.glossary dd{
    margin:2px 0 0 0;
    font-size:14px;
    color:var(--ink-soft);
  }

  /* worked example */
  .example{
    background:var(--white);
    border-left:4px solid var(--teal);
    border-radius:0 6px 6px 0;
    padding:12px 16px;
    margin:10px 0;
    box-shadow:var(--shadow);
  }
  .example .ex-label{
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--teal);
    margin-bottom:4px;
    font-weight:700;
  }
  .example p, .example div{font-size:14.5px; line-height:1.6;}
  .mono{font-family:"Consolas","Courier New",monospace;}

  /* simulation panel */
  .sim-panel{
    background:var(--white);
    border:1px solid #E4D9BE;
    border-radius:10px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .sim-panel h4{
    margin:0 0 4px 0;
    color:var(--navy);
    font-size:15px;
  }
  .sim-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .controls{

    flex-wrap:wrap;
    gap:10px;
    align-items:flex-end;
    margin-bottom:14px;
  }
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); font-family:"Consolas",monospace;}
  .field input, .field select{
    font-family:"Consolas","Courier New",monospace;
    font-size:14px;
    padding:7px 9px;
    border:1px solid #C9BFA0;
    border-radius:5px;
    background:#FFFDF7;
    color:var(--ink);
    width:120px;

  .field textarea{
    font-family:"Consolas","Courier New",monospace;
    font-size:13.5px;
    padding:7px 9px;
    border:1px solid #C9BFA0;
    border-radius:5px;
    background:#FFFDF7;
    color:var(--ink);
  }
  button.btn{
    font-family:"Consolas","Courier New",monospace;
    font-size:13px;
    background:var(--gold);
    color:var(--navy);
    border:none;
    padding:9px 16px;
    border-radius:5px;
    cursor:pointer;
    font-weight:700;
    letter-spacing:0.3px;
  }

  button.btn.secondary{

  button.btn.secondary:hover{background:#c7e6e1;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap;}
  .result-box{
    margin-top:14px;
    background:#F4F8F7;
    border:1px solid var(--teal-dim);
    border-radius:7px;
    padding:12px 16px;
    font-size:14.5px;
    line-height:1.7;
  }
  .result-box .big{
    font-size:20px;
    font-weight:700;
    color:var(--teal);
    font-family:"Consolas",monospace;
  }
  .step{margin:2px 0;}
  .pill{
    display:inline-block;
    background:var(--navy);
    color:#fff;
    font-family:"Consolas",monospace;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    margin-right:6px;
  }
  table.datatable{border-collapse:collapse; width:100%; font-size:13.5px; margin-top:8px;}
  table.datatable th, table.datatable td{
    border:1px solid #D8CFB4;
    padding:6px 9px;
    text-align:center;
    font-family:"Consolas",monospace;
  }
  table.datatable th{background:var(--navy); color:#fff; font-weight:600;}
  table.datatable td.true{color:var(--teal); font-weight:700;}
  table.datatable td.false{color:var(--red); font-weight:700;}
  svg text{font-family:"Consolas","Courier New",monospace;}
  .warn{color:var(--red); font-size:13px; font-weight:700;}

  /* plain-language callout */
  .plain-explain{
    background:#FBF3E0;
    border-left:4px solid var(--gold);
    border-radius:0 6px 6px 0;
    padding:14px 18px;
    margin:0 0 18px 0;
  }
  .plain-explain .ex-label{
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#B3401E;
    margin-bottom:6px;
    font-weight:700;
  }
  .plain-explain p{font-size:15px; line-height:1.7; margin:0 0 8px 0;}
  .plain-explain p:last-child{margin-bottom:0;}

  /* quiz */
  .quiz-toolbar{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .quiz-score{
    display:inline-block;
    background:var(--navy);
    color:#fff;
    font-family:"Consolas",monospace;
    font-size:13px;
    font-weight:700;
    padding:7px 16px;
    border-radius:20px;
  }
  .quiz-progress{
    font-family:"Consolas",monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .quiz-card{
    background:var(--white);
    border:1px solid #E4D9BE;
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .quiz-card.unanswered-flag{border-color:var(--red);}
  .quiz-q{font-size:14.5px; font-weight:700; color:var(--navy); margin-bottom:10px;}
  .quiz-options{display:flex; flex-direction:column; gap:8px;}
  label.quiz-opt{
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    background:#FFFDF7;
    border:1px solid #C9BFA0;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    padding:9px 12px;
    border-radius:6px;

    transition:all .12s ease;

  label.quiz-opt:hover{border-color:var(--teal); background:var(--teal-dim);}
  label.quiz-opt input{margin-top:3px; flex-shrink:0;}
  label.quiz-opt.selected{border-color:var(--navy); background:var(--gold-dim);}
  label.quiz-opt.locked{cursor:default;}
  label.quiz-opt.correct{background:#DFF3E8; border-color:#2E8B57; color:#1F6B41; font-weight:700;}
  label.quiz-opt.incorrect{background:#FBE4DC; border-color:var(--red); color:var(--red); font-weight:700;}
  .quiz-explain{
    margin-top:10px;
    font-size:13.5px;
    color:var(--ink-soft);
    background:#F4F8F7;
    border-radius:6px;
    padding:9px 12px;
    line-height:1.5;
  }
  .quiz-result-banner{
    background:var(--navy);
    color:#fff;
    padding:16px 20px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:15px;
  }
  .quiz-result-banner .big{
    font-family:"Consolas",monospace;
    font-size:26px;
    color:var(--gold);
    font-weight:700;
  }


  .footer-nav{
    display:flex;
    justify-content:space-between;
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--paper-line);

  .footer-nav button{
    background:none;border:none;cursor:pointer;

    color:var(--ink-soft);
    font-size:12.5px;

  .footer-nav button:hover{color:var(--teal);}

  #mobile-toggle{display:none;}

  /* creator credit */
  #brand .creator-line{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed rgba(255,255,255,0.18);
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    color:var(--gold);
  }
  #brand .creator-line a{color:var(--gold-dim); text-decoration:none;}
  #brand .creator-line a:hover{text-decoration:underline;}

  .site-footer{
    margin-top:50px;
    padding:22px 26px;
    background:var(--navy);
    color:#EFE9DA;
    border-radius:10px;
  }
  .site-footer .footer-brand{
    font-family:"Consolas","Courier New",monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:6px;
  }
  .site-footer h4{
    margin:0 0 8px 0;
    font-size:17px;

  .site-footer p{

    font-size:13px;
    color:#B9C2D6;

  .site-footer .footer-contacts{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;

  .site-footer .footer-contacts a{
    color:#EFE9DA;

  .site-footer .footer-contacts a:hover{color:var(--gold); border-color:var(--gold);}
  .site-footer .footer-note{

  /* floating watermark badge */
  #jx-badge{
    position:fixed;
    right:16px;
    bottom:16px;
    background:var(--navy);
    color:var(--gold-dim);

    font-size:11px;

    border-radius:20px;

<script>
/* ============================================================
   SS1 GENERAL MATHEMATICS — INTERACTIVE WORKBOOK
   Single-file, dependency-free, fully offline.
   ============================================================ */

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c===null||c===undefined) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function svgEl(tag, attrs){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function fmtNum(n, dp=4){
  if(!isFinite(n)) return String(n);
  let r = Math.round(n*Math.pow(10,dp))/Math.pow(10,dp);
  return r.toString();
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a; }

/* ---------- shared helpers ---------- */
const DIGITS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function toBase(n, base){
  n = Math.trunc(n);
  if(n===0) return "0";
  let neg = n<0; n = Math.abs(n);
  let out = "";
  while(n>0){ out = DIGITS[n%base] + out; n = Math.floor(n/base); }
  return (neg?"-":"") + out;
}
function fromBase(str, base){
  str = str.trim().toUpperCase();
  let neg = false;
  if(str.startsWith("-")){ neg=true; str = str.slice(1); }
  let val = 0;
  for(const ch of str){
    const d = DIGITS.indexOf(ch);
    if(d<0 || d>=base) return NaN;
    val = val*base + d;
  }
  return neg? -val: val;
}
function drawBarChart(svg, data, opts={}){
  // data: [{label, value}], draws into an svg element already sized via viewBox
  svg.innerHTML = "";
  const W = parseFloat(svg.getAttribute('data-w')||480);
  const H = parseFloat(svg.getAttribute('data-h')||260);
  const padL = 42, padB = 34, padT = 16, padR = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxV = Math.max(1, ...data.map(d=>d.value));
  const n = data.length;
  const bw = innerW / n * 0.62;
  const gap = innerW / n;
  // axes
  svg.appendChild(svgEl('line', {x1:padL, y1:padT, x2:padL, y2:H-padB, stroke:'#8892a8', 'stroke-width':1}));
  svg.appendChild(svgEl('line', {x1:padL, y1:H-padB, x2:W-padR, y2:H-padB, stroke:'#8892a8', 'stroke-width':1}));
  // y ticks
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const v = maxV*i/ticks;
    const y = H-padB - innerH*i/ticks;
    svg.appendChild(svgEl('line', {x1:padL-4, y1:y, x2:W-padR, y2:y, stroke:'#EEE6D2', 'stroke-width':1}));
    const t = svgEl('text', {x:padL-8, y:y+4, 'font-size':10, fill:'#3D4E74', 'text-anchor':'end'});
    t.textContent = fmtNum(v,2); svg.appendChild(t);
  }
  data.forEach((d,i)=>{
    const x = padL + gap*i + (gap-bw)/2;
    const h = innerH * (d.value/maxV);
    const y = H - padB - h;
    svg.appendChild(svgEl('rect', {x, y, width:bw, height:h, fill: opts.color||'#0F6E64', rx:2}));
    const lbl = svgEl('text', {x:x+bw/2, y:H-padB+16, 'font-size':10.5, fill:'#1B2A4A', 'text-anchor':'middle'});
    lbl.textContent = d.label; svg.appendChild(lbl);
    const val = svgEl('text', {x:x+bw/2, y:y-4, 'font-size':10, fill:'#0F6E64', 'text-anchor':'middle'});
    val.textContent = fmtNum(d.value,2); svg.appendChild(val);
  });
}
function mkSVG(w,h){
  const s = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, width:'100%', height:h, 'data-w':w, 'data-h':h});
  s.style.maxWidth = w+'px';
  return s;
}

/* ---------- Quiz engine: select all answers, then Submit, then review ---------- */
function renderQuiz(container, quiz){
  container.innerHTML = '';
  const selected = new Array(quiz.length).fill(null);
  let submitted = false;

  const toolbar = el('div',{class:'quiz-toolbar'});
  const progress = el('div',{class:'quiz-progress'}, `0 / ${quiz.length} answered`);
  toolbar.appendChild(progress);
  container.appendChild(toolbar);

  const banner = el('div',{style:'display:none;'});
  container.appendChild(banner);

  const qList = el('div',{class:'quiz-list'});
  const cards = [];

  quiz.forEach((q,qi)=>{
    const card = el('div',{class:'quiz-card'});
    card.appendChild(el('div',{class:'quiz-q'}, `${qi+1}. ${q.q}`));
    const optWrap = el('div',{class:'quiz-options'});
    const optLabels = [];
    q.options.forEach((opt,oi)=>{
      const radio = el('input',{type:'radio',name:'quiz-'+container.id+'-'+qi});
      radio.addEventListener('change',()=>{
        selected[qi]=oi;
        optLabels.forEach((l,li)=>l.classList.toggle('selected', li===oi));
        progress.textContent = `${selected.filter(s=>s!==null).length} / ${quiz.length} answered`;
      });
      const label = el('label',{class:'quiz-opt'}, radio, el('span',{}, opt));
      optLabels.push(label);
      optWrap.appendChild(label);
    });
    card.appendChild(optWrap);
    qList.appendChild(card);
    cards.push({card, optLabels, optWrap});
  });
  container.appendChild(qList);

  const submitBtn = el('button',{class:'btn'},'Submit Answers');
  const retakeBtn = el('button',{class:'btn secondary', style:'display:none;'},'Retake Quiz');
  const btnRow = el('div',{class:'btn-row', style:'margin-top:6px;'}, submitBtn, retakeBtn);
  container.appendChild(btnRow);

  submitBtn.addEventListener('click',()=>{
    if(submitted) return;
    const unanswered = selected.filter(s=>s===null).length;
    if(unanswered>0){
      if(!confirm(`You have ${unanswered} unanswered question(s). Submit anyway?`)) return;
    }
    submitted = true;
    let score = 0;
    quiz.forEach((q,qi)=>{
      const {optLabels} = cards[qi];
      const chosen = selected[qi];
      if(chosen===q.correct) score++;
      optLabels.forEach((label,oi)=>{
        label.classList.add('locked');
        const radio = label.querySelector('input');
        radio.disabled = true;
        if(oi===q.correct) label.classList.add('correct');
        else if(oi===chosen) label.classList.add('incorrect');
      });
      const card = cards[qi].card;
      if(chosen===null) card.classList.add('unanswered-flag');
      const verdict = chosen===q.correct ? '✓ Correct.' : (chosen===null ? '— You left this blank.' : '✗ Not quite.');
      card.appendChild(el('div',{class:'quiz-explain'}, `${verdict} Correct answer: "${q.options[q.correct]}". ${q.explain}`));
    });
    const pct = Math.round(100*score/quiz.length);
    let remark = pct>=80 ? "Excellent work!" : pct>=60 ? "Good effort — review the ones you missed." : "Keep practising — re-read the explanation above and try again.";
    banner.style.display='block';
    banner.innerHTML='';
    banner.appendChild(el('div',{class:'quiz-result-banner'},
      el('div',{}, `Your score: `, el('span',{class:'big'}, `${score} / ${quiz.length}`), ` (${pct}%)`),
      el('div',{style:'margin-top:6px;font-size:13.5px;color:#CDD5E6;'}, remark)
    ));
    submitBtn.style.display='none';
    retakeBtn.style.display='inline-block';
    window.scrollTo({top: banner.getBoundingClientRect().top + window.scrollY - 100, behavior:'smooth'});
  });
  retakeBtn.addEventListener('click',()=>renderQuiz(container,quiz));
}

<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>You already count in base 10 every day — you just never called it that! Base 10 means we use 10 digits: 0 to 9. Why 10? Simple — we have 10 fingers.</p>
<p>A "base" is just the number of digits a counting system allows. Base 2 (called binary) only uses 0 and 1. Computers "speak" in binary because a switch is either OFF (0) or ON (1). Base 5 uses 0 to 4. Base 16 even borrows letters (A to F) once it runs out of numbers!</p>
<p>Here's the trick: every digit sits in a "spot," and each spot is worth something different. In base 10, the spots (from right to left) are worth 1, 10, 100, 1000... In base 2, the spots are worth 1, 2, 4, 8, 16... Once you know this, switching between bases is just simple multiplying and adding.</p></div>

<p>Step 2: Only add up the spots where the digit is 1.</p>

<p>Now read the remainders from bottom to top: <strong>101101</strong>. Same answer as before — that's how you know it's right!</p></div>

    {t:"Congruent (≡)", d:"Two numbers are congruent modulo n if they leave the same remainder when divided by n. a ≡ b (mod n)."},

  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>You already know modular arithmetic — you just call it "telling the time"! Look at a clock. After 12, it doesn't go to 13 — it goes back to 1. That's exactly what modular arithmetic does: numbers loop back around once they hit a certain point (called the modulus).</p>
<p>So if it's 9 o'clock and 8 hours pass, you don't say "17 o'clock." You count round the clock and land on 5 o'clock. In maths, we write this as "9 + 8 = 5 (mod 12)."</p>
<p>All you're really doing is dividing by the modulus and keeping only the remainder — the leftover bit.</p></div>
<div class="example"><div class="ex-label">Example 1 — Adding with a clock</div>
<p>What is 9 + 8, mod 12?</p>
<p class="mono">Step 1: Add normally → 9 + 8 = 17<br>Step 2: Divide by 12 → 17 ÷ 12 = 1, remainder 5<br>Answer: <strong>5</strong> (mod 12)</p></div>
<div class="example"><div class="ex-label">Example 2 — Multiplying with a modulus</div>
<p>What is 5 × 7, mod 6?</p>
<p class="mono">Step 1: Multiply normally → 5 × 7 = 35<br>Step 2: Divide by 6 → 35 ÷ 6 = 5, remainder 5<br>Answer: <strong>5</strong> (mod 6)</p></div>
<div class="example"><div class="ex-label">Example 3 — Days of the week (a real-life clock!)</div>
<p>Today is Wednesday (let's call it day 3). What day will it be in 10 days?</p>
<p class="mono">3 + 10 = 13<br>13 ÷ 7 = 1, remainder 6<br>Day 6 is <strong>Saturday</strong></p></div>
<div class="example"><div class="ex-label">Where you'll see this in real life</div>
<p>Clocks and calendars, of course. But also: bank cards use a modulus trick to catch typing mistakes, and the codes that keep your WhatsApp messages private are built entirely on modular arithmetic!</p></div>
`,

    const a = el('input',{type:'number',value:'9'});
    const b = el('input',{type:'number',value:'8'});
    const op = el('select',{}, el('option',{value:'+'},'+'), el('option',{value:'-'},'−'), el('option',{value:'*'},'×'));

      svg.innerHTML='';
      const cx=130, cy=130, r=100;
      svg.appendChild(svgEl('circle',{cx,cy,r,fill:'#FFFDF7',stroke:'#16233F','stroke-width':2}));
      const count = Math.min(mod, 24); // avoid overcrowding for huge mod
      for(let i=0;i<count;i++){
        const ang = (Math.PI*2*i/count) - Math.PI/2;
        const x = cx + r*0.82*Math.cos(ang), y = cy + r*0.82*Math.sin(ang);
        const isHi = (i===((highlight%mod)+mod)%mod);

    ));

{
  id:"indices",
  title:"Indices",
  summary:"Indices (powers/exponents) let us write repeated multiplication compactly. Learn the laws of indices, standard form, and how to solve simple equations involving powers.",
  terms:[
    {t:"Index / power / exponent", d:"The small raised number showing how many times a base is multiplied by itself, e.g. in 2⁴, 4 is the index."},
    {t:"Base", d:"The number being raised to a power, e.g. in 2⁴, 2 is the base."},
    {t:"Standard form (scientific notation)", d:"A number written as A × 10ⁿ where 1 ≤ A < 10 and n is an integer."},

  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Imagine writing 2 × 2 × 2 × 2 × 2 every single time. Tiring, right? Indices (also called powers) are just a shortcut. Instead of writing 2 five times, we write 2⁵. Much faster!</p>
<p>The small number on top tells you how many times to multiply the big number by itself. The big number is called the base, and the small number is called the index (or power).</p>
<p>The "laws of indices" are not scary new rules — they're just shortcuts that always work whenever you multiply or divide powers of the same base. Once you see the pattern, you'll never forget it.</p></div>
<div class="example"><div class="ex-label">Rule 1 — Multiplying powers: ADD the indices</div>
<p class="mono">2³ × 2⁴ = 2³⁺⁴ = 2⁷ = 128</p>
<p>Why? 2³ means "three 2's multiplied" and 2⁴ means "four 2's multiplied." Put them together and you have seven 2's multiplied — that's 2⁷.</p></div>
<div class="example"><div class="ex-label">Rule 2 — Dividing powers: SUBTRACT the indices</div>
<p class="mono">3⁶ ÷ 3² = 3⁶⁻² = 3⁴ = 81</p></div>
<div class="example"><div class="ex-label">Rule 3 — A power of a power: MULTIPLY the indices</div>
<p class="mono">(5²)³ = 5²ˣ³ = 5⁶ = 15 625</p></div>
<div class="example"><div class="ex-label">Standard Form — writing big or tiny numbers neatly</div>
<p>Big numbers like 47 200, or tiny numbers like 0.00381, are a pain to write and read. Standard form fixes that with a power of 10.</p>
<p class="mono">47 200 = 4.72 × 10⁴ (move the decimal point 4 places left)<br>0.00381 = 3.81 × 10⁻³ (move the decimal point 3 places right)</p></div>
<div class="example"><div class="ex-label">Solving a simple indicial equation</div>
<p>Solve 2ˣ = 32. Ask yourself: "2 multiplied by itself how many times gives 32?"</p>
<p class="mono">2×2×2×2×2 = 32, so 32 = 2⁵<br>That means 2ˣ = 2⁵, so <strong>x = 5</strong></p></div>
`,

    const base = el('input',{type:'number',value:'2'});
    const m = el('input',{type:'number',value:'3'});
    const opSel = el('select',{}, el('option',{value:'mul'},'aᵐ × aⁿ'), el('option',{value:'div'},'aᵐ ÷ aⁿ'), el('option',{value:'pow'},'(aᵐ)ⁿ'));
    const nn = el('input',{type:'number',value:'4'});
    const res1 = el('div',{class:'result-box'});
    function calc1(){
      const a=parseFloat(base.value), M=parseFloat(m.value), N=parseFloat(nn.value);
      let exp, expr;
      if(opSel.value==='mul'){exp=M+N; expr=`${a}^${M} × ${a}^${N} = ${a}^${M}+${N} = ${a}^${exp}`;}
      else if(opSel.value==='div'){exp=M-N; expr=`${a}^${M} ÷ ${a}^${N} = ${a}^${M}-${N} = ${a}^${exp}`;}
      else {exp=M*N; expr=`(${a}^${M})^${N} = ${a}^${M}×${N} = ${a}^${exp}`;}
      const val = Math.pow(a,exp);
      res1.innerHTML = `<div class="step">${expr}</div><div class="step">= <span class="big">${fmtNum(val,6)}</span></div>`;
    }
    [base,m,nn,opSel].forEach(x=>x.addEventListener('input',calc1));
    opSel.addEventListener('change',calc1);
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Base a'),base),
      el('div',{class:'field'},el('label',{},'m'),m),
      el('div',{class:'field'},el('label',{},'Law'),opSel),
      el('div',{class:'field'},el('label',{},'n'),nn)
    ));
    wrap.appendChild(res1);

    wrap.appendChild(el('div',{style:'height:20px'}));
    wrap.appendChild(el('div',{},el('strong',{},'2. Standard Form Converter')));
    const sfIn = el('input',{type:'text',value:'47200'});
    const sfResult = el('div',{class:'result-box'});
    function calc2(){
      const v = parseFloat(sfIn.value);
      if(isNaN(v)){ sfResult.innerHTML='<span class="warn">Enter a valid number.</span>'; return; }
      if(v===0){ sfResult.innerHTML='<div class="step">0 has no standard form (or is written simply as 0).</div>'; return; }
      const sign = v<0?-1:1; const av=Math.abs(v);
      const exp = Math.floor(Math.log10(av));
      const mant = av/Math.pow(10,exp);
      sfResult.innerHTML = `<div class="step">${v} = <span class="big">${fmtNum(sign*mant,4)} × 10${toSup(exp)}</span></div>`;
    }
    function toSup(n){ const map={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}; return String(n).split('').map(c=>map[c]||c).join(''); }
    sfIn.addEventListener('input',calc2);
    wrap.appendChild(el('div',{class:'controls'}, el('div',{class:'field'},el('label',{},'Number'),sfIn)));
    wrap.appendChild(sfResult);

    wrap.appendChild(el('div',{style:'height:20px'}));
    wrap.appendChild(el('div',{},el('strong',{},'3. Simple Indicial Equation:  aˣ = c')));
    const ieA = el('input',{type:'number',value:'2'});
    const ieC = el('input',{type:'number',value:'32'});
    const ieResult = el('div',{class:'result-box'});
    function calc3(){
      const a=parseFloat(ieA.value), c=parseFloat(ieC.value);
      if(a<=0||a===1){ ieResult.innerHTML='<span class="warn">Choose a base a > 0 and a ≠ 1.</span>'; return; }
      if(c<=0){ ieResult.innerHTML='<span class="warn">c must be positive for a real solution.</span>'; return; }
      const x = Math.log(c)/Math.log(a);
      const nearInt = Math.abs(x-Math.round(x))<1e-9;
      ieResult.innerHTML = `<div class="step">${a}ˣ = ${c}  →  x = log(${c}) / log(${a})</div><div class="step">x = <span class="big">${fmtNum(x,5)}</span>${nearInt?' (exact whole number)':''}</div>`;
    }
    [ieA,ieC].forEach(x=>x.addEventListener('input',calc3));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Base a'),ieA),
      el('div',{class:'field'},el('label',{},'Result c'),ieC)
    ));
    wrap.appendChild(ieResult);

    container.appendChild(wrap);
    calc1(); calc2(); calc3();
  }
},


{
  id:"logs",
  title:"Logarithms",
  summary:"A logarithm answers the question 'to what power must the base be raised to give this number?' Logarithms turn multiplication into addition, which is why they were historically used with log tables to speed up calculation.",
  terms:[
    {t:"Logarithm", d:"log_b(x) = y means bʸ = x. The logarithm of x to base b is the power y."},
    {t:"Common logarithm", d:"A logarithm to base 10, written simply as log(x)."},
    {t:"Characteristic", d:"The whole-number part of a common logarithm, found from the position of the decimal point / power of 10."},
    {t:"Mantissa", d:"The decimal part of a common logarithm, always positive, read from log tables."},
    {t:"Antilogarithm", d:"The reverse of a logarithm — given log(x), find x."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Logarithms sound scary, but they're really just asking one simple question: "What power do I need?"</p>
<p>If someone asks "10 to what power gives 1000?" you'd say "3," because 10³ = 1000. Well, that's exactly what a logarithm is! We just write it differently: log₁₀(1000) = 3.</p>
<p>So a log and a power are two ways of asking the same question, just from different directions. Powers ask "what do I get?" Logs ask "what power got me here?" Before calculators, people used printed "log tables" as a shortcut — logs turn hard multiplying into easy adding.</p></div>
<div class="example"><div class="ex-label">Example 1 — What is log₂(8)?</div>
<p>Ask: "2 to what power gives 8?" Since 2×2×2 = 8, the answer is 3.</p>
<p class="mono">log₂(8) = <strong>3</strong></p></div>
<div class="example"><div class="ex-label">Example 2 — Turning multiplying into adding</div>
<p>log(20) + log(5) should equal log(20 × 5) = log(100).</p>
<p class="mono">log(100) = <strong>2</strong> (because 10² = 100)</p>
<p>See? Instead of multiplying 20 × 5, we just added their logs!</p></div>
<div class="example"><div class="ex-label">Example 3 — Characteristic and Mantissa</div>
<p>For log(4720), the answer is about 3.6739. We split this into two parts:</p>
<p class="mono">Characteristic = 3 (the whole-number part)<br>Mantissa = 0.6739 (the decimal part)</p>
<p>Old textbooks used printed tables to find the mantissa, then added the characteristic by simply counting digits.</p></div>
<div class="example"><div class="ex-label">The Laws of Logarithms, in plain words</div>
<ul>
<li><strong>log(mn) = log m + log n</strong> — multiplying inside becomes adding outside.</li>
<li><strong>log(m/n) = log m − log n</strong> — dividing inside becomes subtracting outside.</li>
<li><strong>log(mⁿ) = n × log m</strong> — a power inside jumps outside as multiplying.</li>
</ul></div>
`,
  quiz:[{"q": "If log₂(8) = 3, then 2³ = ?", "options": ["8", "6", "16", "4"], "correct": 0, "explain": "Logs and powers describe the same fact; 2³=8."}, {"q": "log(mn) = ?", "options": ["log m + log n", "log m × log n", "log m − log n", "(log m)(log n)"], "correct": 0, "explain": "The product law of logarithms."}, {"q": "The mantissa of a common logarithm is:", "options": ["the decimal part of the log", "the whole-number part of the log", "the base", "the antilog"], "correct": 0, "explain": "Mantissa = decimal part; characteristic = whole-number part."}, {"q": "log(100) to base 10 = ?", "options": ["2", "10", "100", "1"], "correct": 0, "explain": "10² = 100."}, {"q": "log(20) + log(5) = ?", "options": ["log(100) = 2", "log(25)", "log(4)", "log(15)"], "correct": 0, "explain": "log 20 + log 5 = log(20×5) = log 100 = 2."}, {"q": "log(100) − log(4) = ?", "options": ["log(25)", "log(96)", "log(400)", "log(50)"], "correct": 0, "explain": "Subtracting logs matches dividing: 100/4=25."}, {"q": "log(x³) in terms of log x = ?", "options": ["3 log x", "log x / 3", "3 + log x", "log 3x"], "correct": 0, "explain": "The power law: bring the exponent to the front."}, {"q": "The characteristic of a common logarithm is:", "options": ["the whole-number part of the log", "the decimal part", "the base of the log", "always negative"], "correct": 0, "explain": "Characteristic is the integer part."}, {"q": "log_b(1) = ?", "options": ["0", "1", "b", "undefined"], "correct": 0, "explain": "Any base raised to the power 0 gives 1."}, {"q": "log_b(b) = ?", "options": ["1", "0", "b", "b²"], "correct": 0, "explain": "A base raised to the power 1 gives itself."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'1. Logarithm / Antilogarithm Calculator'));
    const num = el('input',{type:'number',value:'4720'});
    const base = el('input',{type:'number',value:'10'});
    const res = el('div',{class:'result-box'});
    function calc(){
      const x=parseFloat(num.value), b=parseFloat(base.value);
      if(x<=0||b<=0||b===1){ res.innerHTML='<span class="warn">Need x &gt; 0 and base &gt; 0, base ≠ 1.</span>'; return; }
      const val = Math.log(x)/Math.log(b);
      let extra='';
      if(Math.abs(b-10)<1e-9){
        const characteristic = Math.floor(val);
        const mantissa = val-characteristic;
        extra = `<div class="step">Characteristic = <strong>${characteristic}</strong>, Mantissa ≈ <strong>${fmtNum(mantissa,4)}</strong></div>`;
      }
      res.innerHTML = `<div class="step">log<sub>${b}</sub>(${x}) = <span class="big">${fmtNum(val,5)}</span></div>${extra}`;
    }
    [num,base].forEach(x=>x.addEventListener('input',calc));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Number x'),num),
      el('div',{class:'field'},el('label',{},'Base'),base)
    ));
    wrap.appendChild(res);

    wrap.appendChild(el('div',{style:'height:20px'}));
    wrap.appendChild(el('div',{},el('strong',{},'2. Demonstrate: log(m) + log(n) = log(m×n)')));
    const mIn = el('input',{type:'number',value:'20'});
    const nIn = el('input',{type:'number',value:'5'});
    const res2 = el('div',{class:'result-box'});
    function calc2(){
      const m=parseFloat(mIn.value), n=parseFloat(nIn.value);
      if(m<=0||n<=0){ res2.innerHTML='<span class="warn">m and n must be positive.</span>'; return; }
      const lm=Math.log10(m), ln=Math.log10(n), lmn=Math.log10(m*n);
      res2.innerHTML = `<div class="step">log(${m}) = ${fmtNum(lm,4)}</div><div class="step">log(${n}) = ${fmtNum(ln,4)}</div>
      <div class="step">log(${m}) + log(${n}) = ${fmtNum(lm+ln,4)}</div>
      <div class="step">log(${m}×${n}) = log(${m*n}) = <span class="big">${fmtNum(lmn,4)}</span> — matches!</div>`;
    }
    [mIn,nIn].forEach(x=>x.addEventListener('input',calc2));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'m'),mIn),
      el('div',{class:'field'},el('label',{},'n'),nIn)
    ));
    wrap.appendChild(res2);
    container.appendChild(wrap);
    calc(); calc2();
  }
},


{
  id:"sets",
  title:"Sets",
  summary:"A set is simply a well-defined collection of distinct objects. Sets give us a language and diagrams (Venn diagrams) for describing how groups of things relate to one another.",
  terms:[
    {t:"Set", d:"A well-defined collection of distinct objects, called elements or members, e.g. A = {2, 4, 6, 8}."},
    {t:"Element (∈)", d:"A member of a set. We write 3 ∈ A to mean '3 is an element of A'."},
    {t:"Universal set (U/𝓔)", d:"The set of all objects under consideration in a given problem."},
    {t:"Empty set (∅)", d:"The set with no elements."},
    {t:"Subset (⊆)", d:"Set A is a subset of B if every element of A is also in B."},
    {t:"Union (∪)", d:"A ∪ B is the set of elements in A, or B, or both."},
    {t:"Intersection (∩)", d:"A ∩ B is the set of elements that are in both A and B."},
    {t:"Complement (A′)", d:"The set of elements in the universal set that are NOT in A."},
    {t:"Venn diagram", d:"A picture using overlapping circles inside a rectangle (the universal set) to show relationships between sets."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>A set is just a group of things, listed once each, where the order doesn't matter. Think of it like a shopping bag: "Fruits" might be {mango, orange, banana}. That's a set!</p>
<p>Once you have two bags (sets), you can start comparing them. What's in both bags? That's called the intersection. What's in either bag (or both)? That's the union. What's in one bag but not the other? That's the difference.</p>
<p>A Venn diagram is simply a picture of these bags, drawn as overlapping circles, so you can see the answer instead of just imagining it.</p></div>
<div class="example"><div class="ex-label">Example 1 — Union and Intersection</div>
<p>A = {1,2,3,4,5} and B = {3,4,5,6,7}. Let's compare them.</p>
<p class="mono">A ∪ B (everything from both, no repeats) = {1,2,3,4,5,6,7}<br>A ∩ B (only what's in both) = {3,4,5}</p></div>
<div class="example"><div class="ex-label">Example 2 — Difference</div>
<p>What's in A, but NOT in B? We call this A − B.</p>
<p class="mono">A − B = <strong>{1,2}</strong> — these are the only numbers in A that B doesn't have.</p></div>
<div class="example"><div class="ex-label">Example 3 — Three sets at once</div>
<p>A={1,2,3}, B={2,3,4}, C={3,4,5}. What number is in ALL three?</p>
<p class="mono">A∩B∩C = <strong>{3}</strong> — only 3 shows up in every set.</p></div>
<div class="example"><div class="ex-label">Types of sets you'll meet</div>
<ul>
<li><strong>Empty set (∅)</strong> — a bag with nothing in it.</li>
<li><strong>Equal sets</strong> — two bags with exactly the same items.</li>
<li><strong>Disjoint sets</strong> — two bags that share nothing at all.</li>
<li><strong>Subset</strong> — every item in one bag is also found in a bigger bag.</li>
</ul></div>
`,
  quiz:[{"q": "A={1,2,3}, B={3,4,5}. A∩B = ?", "options": ["{3}", "{1,2,3,4,5}", "{1,2}", "{4,5}"], "correct": 0, "explain": "Only 3 is in both sets."}, {"q": "A∪B for the same sets = ?", "options": ["{1,2,3,4,5}", "{3}", "{1,2}", "{}"], "correct": 0, "explain": "Union combines every element from both sets."}, {"q": "Two sets with no elements in common are called:", "options": ["disjoint", "equal", "subsets", "universal"], "correct": 0, "explain": "Disjoint sets share nothing."}, {"q": "∅ represents:", "options": ["the empty set", "the universal set", "intersection", "union"], "correct": 0, "explain": "∅ is the symbol for a set with no elements."}, {"q": "If every element of A is in B, A is a ___ of B.", "options": ["subset", "superset", "complement", "disjoint set"], "correct": 0, "explain": "That is the definition of a subset."}, {"q": "A={1,2,3,4,5}, B={3,4,5,6,7}. A−B = ?", "options": ["{1,2}", "{6,7}", "{3,4,5}", "{1,2,6,7}"], "correct": 0, "explain": "A−B keeps only elements of A not found in B."}, {"q": "A={1,2,3}, B={2,3,4}, C={3,4,5}. A∩B∩C = ?", "options": ["{3}", "{2,3,4}", "{4}", "{}"], "correct": 0, "explain": "Only 3 appears in all three sets."}, {"q": "n(A) means:", "options": ["the number of elements in A", "the name of set A", "the negative of A", "the complement of A"], "correct": 0, "explain": "n(A) is set notation for the count of elements."}, {"q": "In a Venn diagram, the rectangle represents:", "options": ["the universal set", "set A only", "the empty set", "a subset"], "correct": 0, "explain": "The rectangle always represents the universal set U."}, {"q": "Sets that contain exactly the same elements are called:", "options": ["equal sets", "disjoint sets", "subsets", "finite sets"], "correct": 0, "explain": "Equal sets match element for element."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'Set Builder & Venn Diagram'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Enter comma-separated elements for each set. Tick "Use set C" for a 3-set diagram. Pick an operation to see it computed and shaded.'));

    const aIn = el('input',{type:'text',value:'1,2,3,4,5'});
    const bIn = el('input',{type:'text',value:'3,4,5,6,7'});
    const cIn = el('input',{type:'text',value:'4,5,8,9'});
    const useC = el('input',{type:'checkbox'});
    const opSel = el('select',{});

    function toArr(str){
      return [...new Set(str.split(',').map(s=>s.trim()).filter(s=>s.length))];
    }
    const OPS2 = [
      {id:'union', label:'A ∪ B', formula:(a,b)=>a||b, compute:(A,B)=>[...new Set([...A,...B])]},
      {id:'inter', label:'A ∩ B', formula:(a,b)=>a&&b, compute:(A,B)=>A.filter(x=>B.includes(x))},
      {id:'aonly', label:'A only (A − B)', formula:(a,b)=>a&&!b, compute:(A,B)=>A.filter(x=>!B.includes(x))},
      {id:'bonly', label:'B only (B − A)', formula:(a,b)=>b&&!a, compute:(A,B)=>B.filter(x=>!A.includes(x))},
      {id:'symdiff', label:'Symmetric difference', formula:(a,b)=>(a||b)&&!(a&&b), compute:(A,B)=>[...A.filter(x=>!B.includes(x)),...B.filter(x=>!A.includes(x))]},
    ];
    const OPS3 = [
      {id:'union3', label:'A ∪ B ∪ C', formula:(a,b,c)=>a||b||c, compute:(A,B,C)=>[...new Set([...A,...B,...C])]},
      {id:'inter3', label:'A ∩ B ∩ C', formula:(a,b,c)=>a&&b&&c, compute:(A,B,C)=>A.filter(x=>B.includes(x)&&C.includes(x))},
      {id:'aonly3', label:'A only', formula:(a,b,c)=>a&&!b&&!c, compute:(A,B,C)=>A.filter(x=>!B.includes(x)&&!C.includes(x))},
      {id:'bonly3', label:'B only', formula:(a,b,c)=>b&&!a&&!c, compute:(A,B,C)=>B.filter(x=>!A.includes(x)&&!C.includes(x))},
      {id:'conly3', label:'C only', formula:(a,b,c)=>c&&!a&&!b, compute:(A,B,C)=>C.filter(x=>!A.includes(x)&&!B.includes(x))},
      {id:'aandb', label:'(A ∩ B) only, not C', formula:(a,b,c)=>a&&b&&!c, compute:(A,B,C)=>A.filter(x=>B.includes(x)&&!C.includes(x))},
      {id:'aandc', label:'(A ∩ C) only, not B', formula:(a,b,c)=>a&&c&&!b, compute:(A,B,C)=>A.filter(x=>C.includes(x)&&!B.includes(x))},
      {id:'bandc', label:'(B ∩ C) only, not A', formula:(a,b,c)=>b&&c&&!a, compute:(A,B,C)=>B.filter(x=>C.includes(x)&&!A.includes(x))},
    ];
    function refreshOps(){
      opSel.innerHTML='';
      (useC.checked?OPS3:OPS2).forEach(o=>opSel.appendChild(el('option',{value:o.id},o.label)));
    }
    refreshOps();

    const resultBox = el('div',{class:'result-box'});
    const canvasHolder = el('div',{style:'margin-top:14px;display:flex;justify-content:center;'});
    const canvas = el('canvas',{width:380,height:300,style:'max-width:380px;'});
    canvasHolder.appendChild(canvas);

    function draw(){
      const ctx = canvas.getContext('2d');
      const W=380,H=300;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#FFFDF7'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#16233F'; ctx.lineWidth=2; ctx.strokeRect(6,6,W-12,H-12);

      const list = useC.checked?OPS3:OPS2;
      const op = list.find(o=>o.id===opSel.value) || list[0];
      let cA,rA,cB,rB,cC,rC;
      if(useC.checked){
        rA=rB=rC=95;
        cA={x:150,y:120}; cB={x:230,y:120}; cC={x:190,y:190};
      } else {
        rA=rB=100;
        cA={x:150,y:150}; cB={x:230,y:150};
      }
      function inCirc(px,py,c,r){ return (px-c.x)**2+(py-c.y)**2 <= r*r; }
      // shade region
      ctx.save();
      const step=2;
      for(let x=10;x<W-10;x+=step){
        for(let y=10;y<H-10;y+=step){
          const a = inCirc(x,y,cA,rA), b = inCirc(x,y,cB,rB), c = useC.checked? inCirc(x,y,cC,rC): false;
          const hit = useC.checked? op.formula(a,b,c) : op.formula(a,b);
          if(hit){ ctx.fillStyle='rgba(216,161,30,0.55)'; ctx.fillRect(x,y,step,step); }
        }
      }
      ctx.restore();
      // outlines
      function circleOutline(c,r,color){ ctx.beginPath(); ctx.arc(c.x,c.y,r,0,Math.PI*2); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); }
      circleOutline(cA,rA,'#0F6E64');
      circleOutline(cB,rB,'#B3401E');
      if(useC.checked) circleOutline(cC,rC,'#1B2A4A');
      ctx.font='bold 15px Consolas, monospace';
      ctx.fillStyle='#0F6E64'; ctx.fillText('A', cA.x-(useC.checked?60:70), cA.y-(useC.checked?60:70));
      ctx.fillStyle='#B3401E'; ctx.fillText('B', cB.x+(useC.checked?45:55), cB.y-(useC.checked?60:70));
      if(useC.checked){ ctx.fillStyle='#1B2A4A'; ctx.fillText('C', cC.x-5, cC.y+95); }
      ctx.fillStyle='#3D4E74'; ctx.font='11px Consolas, monospace'; ctx.fillText('U', 14, 22);
    }

    function compute(){
      const A=toArr(aIn.value), B=toArr(bIn.value), C=useC.checked?toArr(cIn.value):[];
      const list = useC.checked?OPS3:OPS2;
      const op = list.find(o=>o.id===opSel.value) || list[0];
      const out = useC.checked? op.compute(A,B,C) : op.compute(A,B);
      resultBox.innerHTML = `<div class="step">n(A) = ${A.length}${useC.checked?`, n(B) = ${B.length}, n(C) = ${C.length}`:`, n(B) = ${B.length}`}</div>
      <div class="step"><strong>${op.label}</strong> = { ${out.join(', ')||'∅'} }</div>
      <div class="step">n(${op.label}) = <span class="big">${out.length}</span></div>`;
      draw();
    }
    [aIn,bIn,cIn].forEach(x=>x.addEventListener('input',compute));
    opSel.addEventListener('change',compute);
    useC.addEventListener('change',()=>{ refreshOps(); cIn.parentElement.style.display = useC.checked?'flex':'none'; compute(); });

    const cField = el('div',{class:'field',style:'display:none'}, el('label',{},'Set C'), cIn);
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'}, el('label',{},'Set A'), aIn),
      el('div',{class:'field'}, el('label',{},'Set B'), bIn),
      cField,
      el('div',{class:'field'}, el('label',{},'3 sets?'), useC),
      el('div',{class:'field'}, el('label',{},'Operation'), opSel)
    ));
    wrap.appendChild(resultBox);
    wrap.appendChild(canvasHolder);
    container.appendChild(wrap);
    compute();
  }
},


{
  id:"variation",
  title:"Simple Equations and Variations",
  summary:"Changing the subject of a formula lets you rearrange it to solve for a different letter. Variation describes how one quantity changes in relation to another — directly, inversely, jointly, or partially.",
  terms:[
    {t:"Subject of a formula", d:"The variable that stands alone on one side of the equation, e.g. y is the subject in y = 3x + 2."},
    {t:"Direct variation", d:"y varies directly as x: y = kx, for a constant k. As x increases, y increases proportionally."},
    {t:"Inverse variation", d:"y varies inversely as x: y = k/x. As x increases, y decreases."},
    {t:"Joint variation", d:"y varies jointly as x and z: y = kxz — depends on the product of two (or more) variables."},
    {t:"Partial variation", d:"y is partly constant and partly varies, e.g. y = a + bx, a sum of a fixed part and a varying part."},
    {t:"Constant of variation (k)", d:"The fixed multiplier linking the varying quantities, found from given data."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p><strong>Part 1 — Changing the subject:</strong> this just means moving letters around in a formula so a different one stands alone, using the exact same moves you already use to solve equations. Whatever you do to one side, you do to the other side too.</p>
<p><strong>Part 2 — Variation:</strong> this describes how two things change together in real life.</p>
<ul>
<li><strong>Direct variation</strong> — both grow together. Buy more bread, pay more money.</li>
<li><strong>Inverse variation</strong> — one grows, the other shrinks. More workers sharing one job means less time needed each.</li>
<li><strong>Joint variation</strong> — depends on two things multiplied together.</li>
<li><strong>Partial variation</strong> — part fixed, part changing, like a taxi fare with a pickup charge plus a cost per kilometre.</li>
</ul></div>
<div class="example"><div class="ex-label">Example 1 — Changing the subject</div>
<p>Make u the subject of v = u + at.</p>
<p class="mono">v = u + at<br>Subtract at from both sides: v − at = u<br>So: <strong>u = v − at</strong></p></div>
<div class="example"><div class="ex-label">Example 2 — Direct variation</div>
<p>y varies directly as x. If y = 12 when x = 4, find y when x = 9.</p>
<p class="mono">Step 1: Find k. y = kx → 12 = k × 4 → k = 3<br>Step 2: y = 3 × 9 = <strong>27</strong></p></div>
<div class="example"><div class="ex-label">Example 3 — Inverse variation</div>
<p>y varies inversely as x. If y = 5 when x = 6, find y when x = 15.</p>
<p class="mono">Step 1: Find k. y = k/x → 5 = k/6 → k = 30<br>Step 2: y = 30/15 = <strong>2</strong></p></div>
<div class="example"><div class="ex-label">Example 4 — Partial variation (like a taxi fare!)</div>
<p>y is partly constant and partly varies as x: y = a + bx. When x=2, y=9. When x=5, y=18. Find y when x=10.</p>
<p class="mono">9 = a + 2b ... (i)<br>18 = a + 5b ... (ii)<br>Subtract (i) from (ii): 9 = 3b → b = 3, then a = 3<br>So y = 3 + 3x → when x=10, y = <strong>33</strong></p></div>
`,
  quiz:[{"q": "Make x the subject of y = mx + c.", "options": ["x = (y−c)/m", "x = y − c/m", "x = (y+c)/m", "x = my − c"], "correct": 0, "explain": "Subtract c then divide by m on both sides."}, {"q": "y varies directly as x; y=10 when x=2. Find k.", "options": ["5", "20", "0.2", "12"], "correct": 0, "explain": "k = y/x = 10/2 = 5."}, {"q": "As x increases in inverse variation, y:", "options": ["decreases", "increases", "stays the same", "cannot tell"], "correct": 0, "explain": "y = k/x, so a bigger x gives a smaller y."}, {"q": "y = a + bx is an example of:", "options": ["partial variation", "direct variation", "inverse variation", "joint variation"], "correct": 0, "explain": "It has a constant part (a) and a varying part (bx)."}, {"q": "In joint variation y = kxz, if both x and z double, y becomes:", "options": ["4 times as large", "2 times as large", "the same", "half as large"], "correct": 0, "explain": "Doubling both multiplied quantities gives 2×2=4 times."}, {"q": "Make h the subject of V = (1/3)πr²h.", "options": ["h = 3V/(πr²)", "h = V/(3πr²)", "h = 3Vπr²", "h = V − 3πr²"], "correct": 0, "explain": "Multiply both sides by 3, then divide by πr²."}, {"q": "y varies jointly as x and z; y=48 when x=4, z=3. Find k.", "options": ["4", "12", "48", "16"], "correct": 0, "explain": "k = 48/(4×3) = 4."}, {"q": "y = k/x and y=6 when x=3. Find y when x=9.", "options": ["2", "18", "3", "54"], "correct": 0, "explain": "k=18, so y=18/9=2."}, {"q": "Which formula shows a partial variation?", "options": ["y = a + bx", "y = kx", "y = k/x", "y = kxz"], "correct": 0, "explain": "Partial variation has a fixed part plus a varying part."}, {"q": "Rearranging v = u + at to solve for a gives:", "options": ["a = (v−u)/t", "a = (v+u)/t", "a = v−u−t", "a = t(v−u)"], "correct": 0, "explain": "Subtract u then divide by t."}],
  sim(container){

    const formulas = {

    const varResult = el('div',{class:'result-box'});

    function updateVarFields(){

      } else if(t==='joint'){
        const Z1=parseFloat(z1.value), Z2=parseFloat(z2.value);
        const k = Y1/(X1*Z1); const y2 = k*X2*Z2;

        <div class="step">Solving simultaneously: b = <strong>${fmtNum(b)}</strong>, a = <strong>${fmtNum(a)}</strong></div>
        <div class="step">Formula: y = ${fmtNum(a)} + ${fmtNum(b)}x</div>
        <div class="step">When x = ${X2}, y = <span class="big">${fmtNum(a+b*X2)}</span></div>`;
      }
    }
    typeSel.addEventListener('change',updateVarFields);
    [y1,x1,z1,x2,z2,y3,x3].forEach(inp=>inp.addEventListener('input',computeVar));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Type'),typeSel),
      el('div',{class:'field'},el('label',{},'y₁'),y1),
      el('div',{class:'field'},el('label',{},'x₁'),x1),

    ));

  }

{
  id:"quadratic",
  title:"Quadratic Equations",
  summary:"A quadratic equation has the form ax² + bx + c = 0. It can be solved by factorization, completing the square, the quadratic formula, or by reading roots off a graph.",
  terms:[
    {t:"Quadratic equation", d:"An equation of the form ax² + bx + c = 0, where a ≠ 0."},
    {t:"Roots / solutions", d:"The values of x that satisfy the equation — where the graph crosses the x-axis."},
    {t:"Factorization", d:"Writing the quadratic as a product of two linear brackets, e.g. (x−2)(x−3)."},
    {t:"Discriminant (b²−4ac)", d:"Determines the nature of the roots: positive → two real roots, zero → one repeated root, negative → no real roots."},
    {t:"Completing the square", d:"Rewriting ax²+bx+c in the form a(x+p)²+q to solve or find the turning point."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>A quadratic equation is any equation with an x² in it, and nothing higher. That squared x makes the graph a smooth U-shape — and a U-shape usually crosses a straight line (the x-axis) in two places. That's why quadratics usually have two answers, called roots.</p>
<p>There's more than one way to solve them — factorising, completing the square, or the quadratic formula. They all give the same answer. Use whichever feels easiest for the numbers in front of you.</p></div>
<div class="example"><div class="ex-label">Method 1 — Factorising</div>
<p>Solve x² − 5x + 6 = 0. We need two numbers that multiply to give 6, and add to give −5. Those numbers are −2 and −3.</p>
<p class="mono">(x − 2)(x − 3) = 0<br>So x = 2 <strong>or</strong> x = 3</p></div>
<div class="example"><div class="ex-label">Method 2 — The Quadratic Formula (always works!)</div>
<p class="mono">x = [−b ± √(b² − 4ac)] / 2a</p>
<p>For x² − 5x + 6 = 0: a=1, b=−5, c=6</p>
<p class="mono">x = [5 ± √(25−24)] / 2 = [5 ± 1] / 2<br>x = 3 <strong>or</strong> x = 2</p></div>
<div class="example"><div class="ex-label">Method 3 — Reading it off a graph</div>
<p>If you draw y = x² − 5x + 6, the curve crosses the x-axis at exactly x = 2 and x = 3 — the same roots as above! Try the graph tool below with any numbers you like.</p></div>
<div class="example"><div class="ex-label">Real-life example — a thrown ball</div>
<p>A ball's height is h = −5t² + 20t. When does it land (h = 0)?</p>
<p class="mono">−5t² + 20t = 0 → −5t(t − 4) = 0 → t = 0 or t = 4<br>The ball lands after <strong>4 seconds</strong>.</p></div>
`,
  quiz:[{"q": "In ax²+bx+c=0, what must a satisfy?", "options": ["a ≠ 0", "a = 0", "a > 0 only", "a < 0 only"], "correct": 0, "explain": "If a=0 the equation is not quadratic."}, {"q": "The roots of x² − 5x + 6 = 0 are:", "options": ["2 and 3", "1 and 6", "−2 and −3", "5 and 6"], "correct": 0, "explain": "(x−2)(x−3)=0."}, {"q": "If b²−4ac is negative, the equation has:", "options": ["no real roots", "two equal roots", "two distinct real roots", "infinite roots"], "correct": 0, "explain": "A negative discriminant means the square root is not real."}, {"q": "The quadratic formula is:", "options": ["x = (−b±√(b²−4ac))/2a", "x = (−b±√(b²+4ac))/2a", "x = (b±√(b²−4ac))/a", "x = −b/2a"], "correct": 0, "explain": "This is the standard quadratic formula."}, {"q": "On a graph of y=ax²+bx+c, the roots are where the curve:", "options": ["crosses the x-axis", "crosses the y-axis", "reaches its minimum", "is undefined"], "correct": 0, "explain": "Roots are the x-values where y=0."}, {"q": "Solve 2x²+3x−5=0. What is the larger root?", "options": ["1", "2", "−1", "2.5"], "correct": 0, "explain": "Using the formula, x=1 or x=−2.5, so the larger is 1."}, {"q": "h=−5t²+20t models a ball's height. When does it land (h=0, t>0)?", "options": ["4 seconds", "5 seconds", "2 seconds", "20 seconds"], "correct": 0, "explain": "−5t(t−4)=0 gives t=4 (excluding t=0)."}, {"q": "The discriminant of x²+2x+1=0 is:", "options": ["0", "4", "−4", "8"], "correct": 0, "explain": "b²−4ac = 4−4 = 0."}, {"q": "A discriminant of exactly 0 means:", "options": ["one repeated root", "two distinct roots", "no real roots", "infinite roots"], "correct": 0, "explain": "The square root term vanishes, giving a single repeated root."}, {"q": "The factorised form of x²−9=0 is:", "options": ["(x−3)(x+3)=0", "(x−9)(x+1)=0", "(x−3)²=0", "x(x−9)=0"], "correct": 0, "explain": "This is the difference of two squares."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'Quadratic Solver & Grapher'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Enter a, b, c for ax² + bx + c = 0. See the factorization (if whole-number roots exist), formula method, and the graph.'));
    const aIn = el('input',{type:'number',value:'1'});
    const bIn = el('input',{type:'number',value:'-5'});
    const cIn = el('input',{type:'number',value:'6'});
    const res = el('div',{class:'result-box'});
    const svgHolder = el('div',{style:'margin-top:14px;display:flex;justify-content:center;'});
    const svg = mkSVG(420,300);
    svgHolder.appendChild(svg);

    function drawGraph(a,b,c,roots){
      svg.innerHTML='';
      const W=420,H=300, padL=40,padB=30,padT=14,padR=14;
      const innerW=W-padL-padR, innerH=H-padT-padB;
      // determine x-range around vertex/roots
      const vx = -b/(2*a);
      let xs = [vx-6, vx+6];
      if(roots && roots.length===2){ xs=[Math.min(...roots,vx)-3, Math.max(...roots,vx)+3]; }
      const xmin=xs[0], xmax=xs[1];
      const pts=[];
      let ymin=Infinity, ymax=-Infinity;
      for(let i=0;i<=60;i++){
        const x = xmin + (xmax-xmin)*i/60;
        const y = a*x*x+b*x+c;
        pts.push([x,y]);
        if(y<ymin) ymin=y; if(y>ymax) ymax=y;
      }
      if(ymin>0) ymin=Math.min(0,ymin); if(ymax<0) ymax=Math.max(0,ymax);
      const yr = (ymax-ymin)||1;
      ymin-=yr*0.1; ymax+=yr*0.1;
      function sx(x){ return padL + (x-xmin)/(xmax-xmin)*innerW; }
      function sy(y){ return padT + (ymax-y)/(ymax-ymin)*innerH; }
      // axes
      if(xmin<0&&xmax>0) svg.appendChild(svgEl('line',{x1:sx(0),y1:padT,x2:sx(0),y2:H-padB,stroke:'#8892a8'}));
      if(ymin<0&&ymax>0) svg.appendChild(svgEl('line',{x1:padL,y1:sy(0),x2:W-padR,y2:sy(0),stroke:'#8892a8'}));
      svg.appendChild(svgEl('rect',{x:padL,y:padT,width:innerW,height:innerH,fill:'none',stroke:'#E4D9BE'}));
      // curve
      const d = pts.map((p,i)=>(i===0?'M':'L')+sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' ');
      svg.appendChild(svgEl('path',{d, fill:'none', stroke:'#0F6E64','stroke-width':2.5}));
      // roots
      if(roots) roots.forEach(r=>{
        svg.appendChild(svgEl('circle',{cx:sx(r), cy:sy(0), r:4, fill:'#B3401E'}));
        const t=svgEl('text',{x:sx(r), y:sy(0)+16,'font-size':10,'text-anchor':'middle',fill:'#B3401E'}); t.textContent=fmtNum(r,2); svg.appendChild(t);
      });
      const t2=svgEl('text',{x:padL,y:14,'font-size':10,fill:'#3D4E74'}); t2.textContent='y'; svg.appendChild(t2);
      const t3=svgEl('text',{x:W-padR,y:H-10,'font-size':10,fill:'#3D4E74','text-anchor':'end'}); t3.textContent='x'; svg.appendChild(t3);
    }

    function solve(){
      const a=parseFloat(aIn.value), b=parseFloat(bIn.value), c=parseFloat(cIn.value);
      if(!a){ res.innerHTML='<span class="warn">a must not be zero (otherwise it is not quadratic).</span>'; return; }
      const D = b*b-4*a*c;
      let html='';
      html += `<div class="step">Discriminant b²−4ac = ${fmtNum(D)}</div>`;
      let roots=null;
      if(D>0){
        const r1=(-b+Math.sqrt(D))/(2*a), r2=(-b-Math.sqrt(D))/(2*a);
        roots=[r1,r2];
        html += `<div class="step">Two real roots: x = <span class="big">${fmtNum(r1)}</span> or x = <span class="big">${fmtNum(r2)}</span></div>`;
        // try integer factorisation
        if(Number.isInteger(a)&&Number.isInteger(b)&&Number.isInteger(c)){
          const rr1=Math.round(r1), rr2=Math.round(r2);
          if(Math.abs(r1-rr1)<1e-6 && Math.abs(r2-rr2)<1e-6){
            const s1 = rr1>=0?`x ${'-'+rr1<0?'':''}- ${rr1}`:`x + ${-rr1}`;
            const s2 = rr2>=0?`x - ${rr2}`:`x + ${-rr2}`;
            html += `<div class="step">Factorized: a(${s1})(${s2}) = 0</div>`;
          }
        }
      } else if(D===0){
        const r = -b/(2*a); roots=[r];
        html += `<div class="step">One repeated root: x = <span class="big">${fmtNum(r)}</span></div>`;
      } else {
        html += `<div class="step">No real roots (the graph does not cross the x-axis).</div>`;
      }
      res.innerHTML = html;
      drawGraph(a,b,c,roots);
    }
    [aIn,bIn,cIn].forEach(x=>x.addEventListener('input',solve));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'a'),aIn),
      el('div',{class:'field'},el('label',{},'b'),bIn),
      el('div',{class:'field'},el('label',{},'c'),cIn)
    ));
    wrap.appendChild(res);
    wrap.appendChild(svgHolder);
    container.appendChild(wrap);
    solve();
  }
},


{
  id:"logic",
  title:"Logical Reasoning",
  summary:"Logical reasoning studies statements that are either true or false, and how we combine them with connectives like AND, OR, NOT to build compound statements — organised using truth tables.",
  terms:[
    {t:"Statement (proposition)", d:"A sentence that is definitely either true or false, e.g. 'Lagos is in Nigeria' (true)."},
    {t:"Simple statement", d:"A single statement with no connective, often labelled p or q."},
    {t:"Compound statement", d:"Two or more simple statements joined by a connective (AND, OR, NOT, IF...THEN)."},
    {t:"Conjunction (AND, ∧)", d:"p ∧ q is true only when both p and q are true."},
    {t:"Disjunction (OR, ∨)", d:"p ∨ q is true when at least one of p, q is true."},
    {t:"Negation (NOT, ¬)", d:"¬p is true exactly when p is false."},
    {t:"Conditional (IF...THEN, →)", d:"p → q is false only when p is true and q is false."},
    {t:"Truth table", d:"A table listing every combination of truth values for the statements, and the resulting truth value of the compound statement."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>A statement is any sentence that is clearly true or clearly false — no maybes. "Lagos is in Nigeria" is a statement (true). "This food is nice" is not — that's just an opinion.</p>
<p>We can join small statements together with connecting words to build bigger ones:</p>
<ul>
<li><strong>AND (∧)</strong> — true only if BOTH parts are true.</li>
<li><strong>OR (∨)</strong> — true if AT LEAST ONE part is true.</li>
<li><strong>NOT (¬)</strong> — flips true to false, and false to true.</li>
<li><strong>IF...THEN (→)</strong> — like a promise. It's only broken if the first part happens but the second part doesn't.</li>
</ul>
<p>A truth table is just a checklist — it tests every possible true/false combination so you know exactly when the whole statement is true.</p></div>
<div class="example"><div class="ex-label">Example — AND, OR, NOT in real life</div>
<p>Let p = "It is raining" and q = "I have an umbrella."</p>
<ul>
<li>p ∧ q = "It is raining AND I have an umbrella" — true only if both are happening.</li>
<li>p ∨ q = "It is raining OR I have an umbrella" — true if at least one is happening.</li>
<li>¬p = "It is NOT raining."</li>
</ul></div>
<div class="example"><div class="ex-label">Example — IF...THEN as a promise</div>
<p>p → q: "If you study hard, you will pass." This promise is only broken if you study hard but STILL fail. Every other combination keeps the promise — even if you didn't study, and still passed by luck!</p></div>
<div class="example"><div class="ex-label">The full truth table</div>
<table class="datatable">
<tr><th>p</th><th>q</th><th>p ∧ q</th><th>p ∨ q</th><th>¬p</th><th>p → q</th></tr>
<tr><td>T</td><td>T</td><td class="true">T</td><td class="true">T</td><td class="false">F</td><td class="true">T</td></tr>
<tr><td>T</td><td>F</td><td class="false">F</td><td class="true">T</td><td class="false">F</td><td class="false">F</td></tr>
<tr><td>F</td><td>T</td><td class="false">F</td><td class="true">T</td><td class="true">T</td><td class="true">T</td></tr>
<tr><td>F</td><td>F</td><td class="false">F</td><td class="false">F</td><td class="true">T</td><td class="true">T</td></tr>
</table></div>
`,

{
  id:"mensuration",
  title:"Mensuration",
  summary:"Mensuration is the branch of maths concerned with measuring shapes — here, the volumes and surface areas of solids: cones, pyramids and cylinders.",
  terms:[
    {t:"Volume", d:"The amount of space a solid occupies, measured in cubic units (cm³, m³)."},
    {t:"Surface area", d:"The total area of all the outer faces/surfaces of a solid, measured in square units."},
    {t:"Curved surface area (CSA)", d:"The area of the curved part only (excludes flat circular ends), used for cones and cylinders."},
    {t:"Slant height (ℓ)", d:"The distance from the apex of a cone/pyramid to the edge of the base, along the slanted surface."},
    {t:"Base radius / base edge", d:"The radius of a circular base (cylinder, cone) or the edge length of a polygonal base (pyramid)."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Mensuration just means measuring solid (3D) shapes. We care about two things: how much space is INSIDE the shape (volume), and how much material would COVER the outside (surface area).</p>
<p>Here's a neat trick: cones and pyramids are basically cylinders and boxes that "shrink to a point." That's exactly why they both get a 1/3 in their volume formula — a pointy shape holds less than a straight-up-and-down one with the same base and height.</p></div>
<div class="example"><div class="ex-label">Cylinder — like a tin of milk</div>
<p class="mono">Volume = πr²h<br>Curved Surface Area = 2πrh<br>Total Surface Area = 2πrh + 2πr²</p>
<p>Example: radius 7cm, height 20cm (π ≈ 22/7)</p>
<p class="mono">Volume = (22/7) × 7² × 20 = <strong>3080 cm³</strong></p></div>
<div class="example"><div class="ex-label">Cone — like an ice-cream cone</div>
<p class="mono">Slant height ℓ = √(r² + h²)<br>Volume = (1/3)πr²h<br>Curved Surface Area = πrℓ</p>
<p>Example: radius 3.5cm, height 12cm</p>
<p class="mono">Volume = (1/3) × (22/7) × 3.5² × 12 ≈ <strong>154 cm³</strong></p></div>
<div class="example"><div class="ex-label">Square-based Pyramid — like the Egyptian pyramids!</div>
<p class="mono">Volume = (1/3) × a² × h &nbsp;(a = length of the base edge)<br>Slant height ℓ = √(h² + (a/2)²)<br>Total Surface Area = a² + 2aℓ</p></div>
`,
  quiz:[{"q": "Volume of a cylinder = ?", "options": ["πr²h", "2πrh", "(1/3)πr²h", "πr²+2πrh"], "correct": 0, "explain": "Cross-sectional circle area × height."}, {"q": "Volume of a cone = ?", "options": ["(1/3)πr²h", "πr²h", "2πr²h", "πrl"], "correct": 0, "explain": "A cone holds a third of the matching cylinder's volume."}, {"q": "Slant height of a cone with r=3, h=4:", "options": ["5", "7", "12", "1"], "correct": 0, "explain": "Pythagoras: √(3²+4²)=5."}, {"q": "Curved surface area of a cylinder = ?", "options": ["2πrh", "πr²h", "πrl", "2πr²"], "correct": 0, "explain": "It is the circumference times the height."}, {"q": "Both cones and pyramids use which fraction in their volume formula?", "options": ["1/3", "1/2", "2/3", "1/4"], "correct": 0, "explain": "Both taper to a point, giving the 1/3 factor."}, {"q": "Volume of a cylinder radius 7, height 20 (π≈22/7):", "options": ["3080", "1540", "6160", "2200"], "correct": 0, "explain": "πr²h = (22/7)×49×20 = 3080 cm³."}, {"q": "Total surface area of a cone r=5, ℓ=13 (nearest whole number):", "options": ["283", "204", "79", "157"], "correct": 0, "explain": "πrℓ+πr² ≈ 204.2+78.5 ≈ 283."}, {"q": "Formula for total surface area of a cylinder:", "options": ["2πr(h+r)", "πr²h", "2πrh", "πr²+πrl"], "correct": 0, "explain": "Curved surface plus the two circular ends."}, {"q": "For a square-based pyramid, volume = ?", "options": ["(1/3)a²h", "a²h", "(1/2)a²h", "2a²h"], "correct": 0, "explain": "Base area (a²) times height, divided by 3."}, {"q": "Which solid has curved surface area formula πrℓ?", "options": ["Cone", "Cylinder", "Pyramid", "Cube"], "correct": 0, "explain": "ℓ (slant height) only applies to cones."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'Solid Shape Calculator'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Pick a shape, enter its dimensions, and get the volume and surface area with the formula used.'));
    const shapeSel = el('select',{}, el('option',{value:'cyl'},'Cylinder'), el('option',{value:'cone'},'Cone'), el('option',{value:'pyr'},'Square-based Pyramid'));
    const rIn = el('input',{type:'number',value:'3.5'});

    function drawShape(shape){

      if(shape==='cyl'){

        svg.appendChild(svgEl('line',{x1:cx-70,y1:50,x2:cx-70,y2:170,stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('line',{x1:cx+70,y1:50,x2:cx+70,y2:170,stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('path',{d:`M ${cx-70} 170 A 70 18 0 0 0 ${cx+70} 170`, fill:'none', stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('path',{d:`M ${cx-70} 170 A 70 18 0 0 1 ${cx+70} 170`, fill:'none', stroke:'#16233F','stroke-width':2,'stroke-dasharray':'3,3'}));
        svg.appendChild(svgEl('line',{x1:cx,y1:50,x2:cx,y2:170,stroke:'#0F6E64','stroke-width':1.5,'stroke-dasharray':'4,2'}));
        const t=svgEl('text',{x:cx+6,y:112,'font-size':11,fill:'#0F6E64'}); t.textContent='h'; svg.appendChild(t);
        const t2=svgEl('text',{x:cx,y:44,'font-size':11,fill:'#16233F','text-anchor':'middle'}); t2.textContent='r'; svg.appendChild(t2);
      } else if(shape==='cone'){
        svg.appendChild(svgEl('ellipse',{cx,cy:170,rx:70,ry:18,fill:'none',stroke:'#16233F','stroke-width':2}));

        svg.appendChild(svgEl('line',{x1:cx,y1:30,x2:cx,y2:170,stroke:'#0F6E64','stroke-width':1.5,'stroke-dasharray':'4,2'}));
        const t=svgEl('text',{x:cx+6,y:100,'font-size':11,fill:'#0F6E64'}); t.textContent='h'; svg.appendChild(t);
      } else {
        svg.appendChild(svgEl('polygon',{points:`${cx-70},175 ${cx-20},190 ${cx+80},170 ${cx+30},155`, fill:'none', stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('line',{x1:cx-45,y1:182,x2:cx-10,y2:35,stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('line',{x1:cx+55,y1:162,x2:cx-10,y2:35,stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('line',{x1:cx+5,y1:182,x2:cx-10,y2:35,stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('line',{x1:cx-10,y1:130,x2:cx-10,y2:35,stroke:'#0F6E64','stroke-width':1.5,'stroke-dasharray':'4,2'}));
        const t=svgEl('text',{x:cx,y:90,'font-size':11,fill:'#0F6E64'}); t.textContent='h'; svg.appendChild(t);
      }

    function calc(){
      const shape = shapeSel.value;
      const r = parseFloat(rIn.value), h = parseFloat(hIn.value);

      let html='';
      if(shape==='cyl'){
        const vol = Math.PI*r*r*h, csa=2*Math.PI*r*h, tsa=2*Math.PI*r*(h+r);
        html = `<div class="step">Volume = πr²h = π×${r}²×${h} = <span class="big">${fmtNum(vol,2)} cm³</span></div>
        <div class="step">Curved Surface Area = 2πrh = <strong>${fmtNum(csa,2)} cm²</strong></div>
        <div class="step">Total Surface Area = 2πr(h+r) = <strong>${fmtNum(tsa,2)} cm²</strong></div>`;
      } else if(shape==='cone'){
        const l = Math.sqrt(r*r+h*h);
        const vol = (1/3)*Math.PI*r*r*h, csa=Math.PI*r*l, tsa=csa+Math.PI*r*r;
        html = `<div class="step">Slant height ℓ = √(r²+h²) = √(${r}²+${h}²) = <strong>${fmtNum(l,2)} cm</strong></div>
        <div class="step">Volume = (1/3)πr²h = <span class="big">${fmtNum(vol,2)} cm³</span></div>
        <div class="step">Curved Surface Area = πrℓ = <strong>${fmtNum(csa,2)} cm²</strong></div>
        <div class="step">Total Surface Area = πrℓ + πr² = <strong>${fmtNum(tsa,2)} cm²</strong></div>`;
      } else {
        const l = Math.sqrt(h*h+(r/2)*(r/2));
        const vol = (1/3)*r*r*h, tsa=r*r+2*r*l;
        html = `<div class="step">Slant height ℓ = √(h²+(a/2)²) = <strong>${fmtNum(l,2)} cm</strong></div>
        <div class="step">Volume = (1/3)a²h = <span class="big">${fmtNum(vol,2)} cm³</span></div>

    wrap.appendChild(el('div',{class:'controls'},

{
  id:"construction",
  title:"Geometrical Constructions",
  summary:"Using only a ruler (straightedge) and a pair of compasses, we can construct exact angles and shapes without a protractor — a skill that trains precise, logical drawing.",
  terms:[
    {t:"Straightedge", d:"An unmarked ruler used only to draw straight lines, not to measure length in formal constructions."},
    {t:"Compasses", d:"An instrument for drawing arcs/circles of a fixed radius and for transferring lengths."},
    {t:"Arc", d:"Part of the circumference of a circle, drawn with compasses to mark equal distances."},
    {t:"Perpendicular bisector", d:"A line that cuts another line exactly in half at 90°."},
    {t:"Angle bisector", d:"A line that splits an angle into two exactly equal halves."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>In construction, you are NOT allowed to use a protractor. Sounds strange, right? The whole point is to draw a perfectly exact angle using only two tools: a plain ruler (for straight lines) and a pair of compasses (for drawing arcs — curved marks — of equal length).</p>
<p>Here's the one trick behind every construction: if you draw two arcs with the SAME radius (compass opening), any point where they cross is guaranteed to be exactly that same distance from both centres. That guarantee is what makes the angle come out perfect, every single time.</p></div>
<div class="example"><div class="ex-label">Constructing 60°, step by step</div>
<ol>
<li>Draw a straight line and mark a point O on it.</li>
<li>Open your compasses to any width. Put the point on O and draw an arc that crosses the line — call that point A.</li>
<li>Without changing the compass width, put the point on A and draw another arc crossing the first one — call that point B.</li>
<li>Draw a line from O straight through B. The angle you've made is exactly <strong>60°</strong>!</li>
</ol></div>
<div class="example"><div class="ex-label">Constructing 90°, step by step</div>
<ol>
<li>Draw a line and mark point O on it.</li>
<li>With centre O, draw arcs that cross the line on BOTH sides of O, the same distance away — call them P and Q.</li>
<li>With the same (or a wider) compass width, draw arcs from P and from Q that cross each other above the line.</li>
<li>Join O to that crossing point. That angle is exactly <strong>90°</strong>.</li>
</ol></div>
<div class="example"><div class="ex-label">Getting 45° and 30° for free!</div>
<p>Once you have a 90° angle, just cut it exactly in half (this is called "bisecting") to get two 45° angles. Same idea: cut a 60° angle in half to get two 30° angles. No extra work needed!</p></div>
`,
  quiz:[{"q": "Which tools are used for formal geometric construction?", "options": ["Ruler (straightedge) and compasses only", "Protractor and ruler", "Compasses only", "Protractor only"], "correct": 0, "explain": "No protractor is allowed in formal construction."}, {"q": "A 90° angle is constructed using arcs that:", "options": ["meet above the line from two equidistant points", "are drawn randomly", "measure exactly 90° directly", "only touch the line once"], "correct": 0, "explain": "Equal-radius arcs from two equidistant points guarantee the right angle."}, {"q": "To construct 45°, you should:", "options": ["bisect a 90° angle", "bisect a 60° angle", "draw a 45° arc directly", "trisect a 90° angle"], "correct": 0, "explain": "Half of 90° is 45°."}, {"q": "An angle bisector:", "options": ["splits an angle into two equal halves", "doubles an angle", "measures an angle", "extends a line"], "correct": 0, "explain": "That is exactly its definition."}, {"q": "An arc is:", "options": ["part of a circle's circumference", "a straight line", "a full circle", "an angle"], "correct": 0, "explain": "An arc is a curved portion of a circle."}, {"q": "To construct an equilateral triangle you use:", "options": ["two arcs of equal radius from the two endpoints of a segment", "a protractor set to 60°", "three different radii", "a single arc only"], "correct": 0, "explain": "Equal arcs from both ends guarantee equal sides."}, {"q": "The perpendicular bisector of a segment:", "options": ["cuts it exactly in half at 90°", "doubles its length", "is always horizontal", "only works on curved lines"], "correct": 0, "explain": "It bisects the segment and is perpendicular to it."}, {"q": "To construct 30°, you should:", "options": ["bisect a 60° angle", "bisect a 90° angle", "draw it directly with a ruler", "construct 45° first"], "correct": 0, "explain": "Half of 60° is 30°."}, {"q": "Why must both arcs in a construction have the same radius?", "options": ["To guarantee equal distances from both centres", "To make the drawing neater", "It doesn't matter", "To save time"], "correct": 0, "explain": "Equal radius is what forces the geometry to be exact."}, {"q": "A straightedge is used to:", "options": ["draw straight lines only, not to measure", "measure exact lengths", "draw circles", "measure angles"], "correct": 0, "explain": "In formal constructions, the ruler is unmarked."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'Compass Construction — Step Player'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Choose an angle and press "Next Step" to see how it is built with ruler and compasses, one arc at a time.'));
    const angleSel = el('select',{}, el('option',{value:'60'},'60°'), el('option',{value:'90'},'90°'), el('option',{value:'45'},'45°'), el('option',{value:'30'},'30° (bisect 60°)'));
    const stepLabel = el('div',{class:'result-box'});
    const svgHolder = el('div',{style:'margin-top:14px;display:flex;justify-content:center;'});
    const svg = mkSVG(360,260);
    svgHolder.appendChild(svg);
    let step = 0;

    const O = {x:80,y:200}, A={x:220,y:200};
    function baseLine(){

    }

        const t=svgEl('text',{x:A.x+4,y:216,'font-size':12,fill:'#0F6E64'}); t.textContent='A'; svg.appendChild(t);

        const B = {x:O.x+r*Math.cos(-Math.PI/3), y:O.y+r*Math.sin(-Math.PI/3)};
        svg.appendChild(svgEl('path',{d:arcPath(A.x,A.y,r,Math.PI*0.65,Math.PI*1.1), fill:'none', stroke:'#B3401E','stroke-width':1.5}));
        svg.appendChild(svgEl('circle',{cx:B.x,cy:B.y,r:3,fill:'#B3401E'}));
        const t=svgEl('text',{x:B.x-4,y:B.y-8,'font-size':12,fill:'#B3401E'}); t.textContent='B'; svg.appendChild(t);
        if(s>=3){
          svg.appendChild(svgEl('line',{x1:O.x,y1:O.y,x2:B.x,y2:B.y,stroke:'#16233F','stroke-width':2}));
          svg.appendChild(svgEl('path',{d:arcPath(O.x,O.y,30,-Math.PI/3,0), fill:'none',stroke:'#D8A11E','stroke-width':2}));
          const t=svgEl('text',{x:O.x+34,y:O.y-14,'font-size':13,fill:'#D8A11E','font-weight':'700'}); t.textContent='60°'; svg.appendChild(t);

    function render90(s){
