        svg.appendChild(svgEl('path',{d:arcPath(B.x,B.y,r,-1.3,-0.3), fill:'none', stroke:'#B3401E','stroke-width':1.5}));
        svg.appendChild(svgEl('path',{d:arcPath(C2.x,C2.y,r,-Math.PI+1.3,-Math.PI+0.3), fill:'none', stroke:'#B3401E','stroke-width':1.5}));
        top = {x:O.x, y:O.y-Math.sqrt(r*r-70*70)};
        svg.appendChild(svgEl('circle',{cx:top.x,cy:top.y,r:3,fill:'#B3401E'}));
        svg.appendChild(el2text(top.x+10,top.y,'#B3401E','R'));
      }
      if(s>=3 && top){
        svg.appendChild(svgEl('line',{x1:O.x,y1:O.y,x2:top.x,y2:top.y,stroke:'#16233F','stroke-width':2}));
        svg.appendChild(svgEl('path',{d:arcPath(O.x,O.y,30,-Math.PI/2,0), fill:'none',stroke:'#D8A11E','stroke-width':2}));
        svg.appendChild(el2text(O.x+34,O.y-34,'#D8A11E','90°',true));
      }
    }
    function render45(s){
      render90(3);
      const top = {x:O.x, y:O.y-89.4};
      if(s>=4){
        svg.appendChild(svgEl('path',{d:arcPath(O.x,O.y,50,-Math.PI/2,0), fill:'none',stroke:'#8892a8','stroke-width':1,'stroke-dasharray':'3,3'}));
        const bis = {x:O.x+64*Math.cos(-Math.PI/4), y:O.y+64*Math.sin(-Math.PI/4)};
        svg.appendChild(svgEl('line',{x1:O.x,y1:O.y,x2:bis.x,y2:bis.y,stroke:'#0F6E64','stroke-width':2,'stroke-dasharray':'5,3'}));
        svg.appendChild(el2text(bis.x+8,bis.y-4,'#0F6E64','45°',true));

    function render30(s){

        svg.appendChild(svgEl('line',{x1:O.x,y1:O.y,x2:bis.x,y2:bis.y,stroke:'#0F6E64','stroke-width':2,'stroke-dasharray':'5,3'}));
        svg.appendChild(el2text(bis.x+6,bis.y-6,'#0F6E64','30°',true));

      const t=svgEl('text',{x,y,'font-size':bold?13:12,fill,'font-weight':bold?'700':'400'}); t.textContent=txt; return t;
    }
    const STEPS = {
      "60": ["Draw a base line and mark point O.","Draw an arc from O crossing the line at A.","From A, draw an equal-radius arc crossing the first arc at B; join O to B.","Angle AOB = 60°."],
      "90": ["Draw a base line and mark point O.","Mark two points P, Q equidistant from O.","From P and Q, draw equal-radius arcs meeting above the line at R.","Join O to R — angle is 90°."],
      "45": ["Construct 90° first (as above).","Draw an arc from O crossing both arms of the right angle.","From those two points, draw equal-radius arcs meeting at a new point.","Join O through that point — this bisects 90° into two 45° angles."],
      "30": ["Construct 60° first (as above).","Draw an arc from O crossing both arms of the 60° angle.","From those two points draw equal-radius arcs meeting at a new point.","Join O through that point — this bisects 60° into two 30° angles."]
    };
    function render(){
      const a = angleSel.value.startsWith('30')?'30':angleSel.value;

{
  id:"proofs",
  title:"Deductive Proofs",
  summary:"Deductive proof uses previously accepted facts (axioms/theorems) to logically establish new geometric facts — such as the angle sum of a triangle and the angle relationships formed by a transversal crossing parallel lines.",
  terms:[
    {t:"Theorem", d:"A geometric fact that has been proven true using logical deduction from simpler facts."},
    {t:"Transversal", d:"A line that crosses two (usually parallel) lines, forming eight angles at the two intersections."},
    {t:"Corresponding angles", d:"Angles in matching positions at each intersection when a transversal crosses two lines; equal if the lines are parallel."},
    {t:"Alternate angles", d:"Angles on opposite sides of the transversal, between the two lines ('Z angles'); equal if the lines are parallel."},
    {t:"Co-interior (allied) angles", d:"Angles on the same side of the transversal, between the two lines ('C angles'); sum to 180° if the lines are parallel."},
    {t:"Exterior angle of a triangle", d:"The angle formed outside a triangle when one side is extended; equals the sum of the two interior opposite angles."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>A "deductive proof" just means explaining WHY something is true, using facts we already trust — not just saying "it looks right." Think of it like a detective building a case: step by step, using clues (known facts) to reach a solid conclusion.</p>
<p>Two facts you'll use again and again:</p>
<ul>
<li>The three angles inside ANY triangle always add up to 180°. Always. No matter how the triangle is shaped.</li>
<li>When a straight line crosses two parallel lines (like railway tracks), it creates a repeating, predictable pattern of angles.</li>
</ul></div>
<div class="example"><div class="ex-label">Example — Finding a missing angle</div>
<p>A triangle has angles 50° and 65°. What is the third angle?</p>
<p class="mono">180 − 50 − 65 = <strong>65°</strong></p></div>
<div class="example"><div class="ex-label">Example — The Exterior Angle Trick</div>
<p>If you extend one side of a triangle, you make an "exterior angle." This exterior angle always equals the sum of the two OTHER (opposite) interior angles.</p>
<p class="mono">Interior angles 40° and 70° → Exterior angle = 40 + 70 = <strong>110°</strong></p></div>
<div class="example"><div class="ex-label">Parallel Lines — 3 patterns to spot</div>
<ul>
<li><strong>Corresponding angles</strong> (same position at each crossing) — always EQUAL.</li>
<li><strong>Alternate angles</strong> (opposite sides of the crossing line, forming a "Z" shape) — always EQUAL.</li>
<li><strong>Co-interior angles</strong> (same side, forming a "C" shape) — always add up to 180°.</li>
</ul></div>
`,
  quiz:[{"q": "The angles in any triangle sum to:", "options": ["180°", "90°", "360°", "270°"], "correct": 0, "explain": "This is the angle sum theorem for triangles."}, {"q": "The exterior angle of a triangle equals:", "options": ["the sum of the two interior opposite angles", "the third interior angle", "180 minus itself", "always 90°"], "correct": 0, "explain": "This is the exterior angle theorem."}, {"q": "When a transversal crosses two parallel lines, corresponding angles are:", "options": ["equal", "supplementary", "complementary", "always 90°"], "correct": 0, "explain": "Corresponding angles are always equal on parallel lines."}, {"q": "Co-interior (allied) angles on parallel lines sum to:", "options": ["180°", "90°", "360°", "they are always equal"], "correct": 0, "explain": "Co-interior angles are supplementary."}, {"q": "Alternate angles on parallel lines are always:", "options": ["equal", "supplementary", "unequal", "90°"], "correct": 0, "explain": "Alternate (Z) angles are equal."}, {"q": "A triangle has angles 50° and 65°. The third angle is:", "options": ["65°", "55°", "75°", "50°"], "correct": 0, "explain": "180−50−65=65."}, {"q": "A triangle has interior angles 40° and 70°. The exterior angle at the third vertex is:", "options": ["110°", "70°", "40°", "180°"], "correct": 0, "explain": "Exterior angle = sum of the two opposite interior angles = 40+70."}, {"q": "Alternate angles are sometimes nicknamed:", "options": ["Z angles", "C angles", "F angles", "X angles"], "correct": 0, "explain": "Their shape resembles the letter Z."}, {"q": "Corresponding angles are sometimes nicknamed:", "options": ["F angles", "Z angles", "C angles", "X angles"], "correct": 0, "explain": "Their shape resembles the letter F."}, {"q": "If one interior angle of a triangle is 90°, the other two must sum to:", "options": ["90°", "180°", "45°", "270°"], "correct": 0, "explain": "180−90=90."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'1. Triangle Angle-Sum Explorer'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Adjust two angles — the third is calculated automatically so all three always sum to 180°.'));
    const angA = el('input',{type:'range',min:'10',max:'150',value:'60'});
    const angB = el('input',{type:'range',min:'10',max:'150',value:'70'});
    const triRes = el('div',{class:'result-box'});
    const svg1 = mkSVG(320,220);
    function drawTriangle(){
      let A=parseInt(angA.value), B=parseInt(angB.value);
      if(A+B>=170){ B=170-A; angB.value=B; }
      const C = 180-A-B;
      svg1.innerHTML='';
      // place triangle: base from (40,180) to (280,180), apex computed from angles
      const bx1=40,by=180,bx2=280;
      const Arad=A*Math.PI/180, Brad=B*Math.PI/180;
      // solve apex via law: intersection of two rays
      const base = bx2-bx1;
      const apexX = bx1 + (base*Math.tan(Brad))/(Math.tan(Arad)+Math.tan(Brad));
      const apexY = by - (base*Math.tan(Arad)*Math.tan(Brad))/(Math.tan(Arad)+Math.tan(Brad));
      svg1.appendChild(svgEl('polygon',{points:`${bx1},${by} ${bx2},${by} ${apexX},${apexY}`, fill:'#FFFDF7', stroke:'#16233F','stroke-width':2}));
      svg1.appendChild(el('title')); // noop
      const t1=svgEl('text',{x:bx1+18,y:by-8,'font-size':13,fill:'#0F6E64','font-weight':'700'}); t1.textContent=A+'°'; svg1.appendChild(t1);
      const t2=svgEl('text',{x:bx2-30,y:by-8,'font-size':13,fill:'#B3401E','font-weight':'700'}); t2.textContent=B+'°'; svg1.appendChild(t2);
      const t3=svgEl('text',{x:apexX-10,y:apexY+18,'font-size':13,fill:'#D8A11E','font-weight':'700'}); t3.textContent=C+'°'; svg1.appendChild(t3);
      triRes.innerHTML = `<div class="step">∠A = ${A}°, ∠B = ${B}°, ∠C = 180 − ${A} − ${B} = <span class="big">${C}°</span></div><div class="step">Sum = ${A}+${B}+${C} = <strong>180°</strong> ✓</div>`;
    }
    [angA,angB].forEach(x=>x.addEventListener('input',drawTriangle));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Angle A'),angA),

    wrap.appendChild(triRes);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg1));

    wrap.appendChild(el('div',{style:'height:22px'}));
    wrap.appendChild(el('div',{},el('strong',{},'2. Parallel Lines & Transversal Explorer')));
    wrap.appendChild(el('div',{class:'sim-hint'},'Set one angle; see all eight angles fill in, and highlight a chosen relationship.'));
    const baseAngle = el('input',{type:'range',min:'20',max:'160',value:'65'});
    const relSel = el('select',{}, el('option',{value:'corr'},'Corresponding angles'), el('option',{value:'alt'},'Alternate angles'), el('option',{value:'coint'},'Co-interior angles'));
    const svg2 = mkSVG(360,240);
    const relRes = el('div',{class:'result-box'});
    function drawTransversal(){
      const a = parseInt(baseAngle.value);
      svg2.innerHTML='';
      const y1=70, y2=170, xL=20, xR=340;
      svg2.appendChild(svgEl('line',{x1:xL,y1:y1,x2:xR,y2:y1,stroke:'#16233F','stroke-width':2}));
      svg2.appendChild(svgEl('line',{x1:xL,y1:y2,x2:xR,y2:y2,stroke:'#16233F','stroke-width':2}));
      // transversal
      const cx1=110, cx2=250;
      svg2.appendChild(svgEl('line',{x1:cx1-40,y1:20,x2:cx2+40,y2:220,stroke:'#16233F','stroke-width':2}));
      // angle labels: at each intersection, 4 angles numbered 1-4 (top) and 5-8 (bottom)
      // Using simple layout: top intersection point approx (150,70), bottom (210,170) — approximate along the transversal line
      const topPt = {x: 20 + (70-20)*( (cx2+40-(cx1-40))/(220-20) ), y:70}; // not exact, use param
      // parametrize transversal: x = (cx1-40) + t*((cx2+40)-(cx1-40)), y = 20 + t*(220-20)
      function ptAtY(y){ const t=(y-20)/(220-20); return {x:(cx1-40)+t*((cx2+40)-(cx1-40)), y}; }
      const P1 = ptAtY(y1), P2 = ptAtY(y2);
      const b = 180-a;
      const angles = {
        // at P1 (top line): 1=top-left,2=top-right,3=bottom-left,4=bottom-right
        1:a,2:b,3:b,4:a,
        // at P2 (bottom line): 5=top-left,6=top-right,7=bottom-left,8=bottom-right
        5:a,6:b,7:b,8:a
      };
      const HI = {
        corr: [2,6], alt: [4,6], coint: [4,5]
      }[relSel.value];
      function lbl(x,y,num){
        const isHi = HI.includes(num);
        const t = svgEl('text',{x,y,'font-size':12,fill:isHi?'#B3401E':'#3D4E74','font-weight':isHi?'700':'400'});
        t.textContent = angles[num]+'°';
        svg2.appendChild(t);
        if(isHi) svg2.appendChild(svgEl('circle',{cx:x-4,cy:y-4,r:12,fill:'none',stroke:'#B3401E','stroke-width':1.5}));
      }
      lbl(P1.x-32,P1.y-12,1); lbl(P1.x+14,P1.y-12,2); lbl(P1.x-32,P1.y+22,3); lbl(P1.x+14,P1.y+22,4);
      lbl(P2.x-32,P2.y-12,5); lbl(P2.x+14,P2.y-12,6); lbl(P2.x-32,P2.y+22,7); lbl(P2.x+14,P2.y+22,8);
      const names = {corr:'Corresponding',alt:'Alternate',coint:'Co-interior'};
      const rel = relSel.value;
      const sumTxt = rel==='coint' ? `${angles[HI[0]]}° + ${angles[HI[1]]}° = ${angles[HI[0]]+angles[HI[1]]}° (supplementary)` : `${angles[HI[0]]}° = ${angles[HI[1]]}° (equal)`;
      relRes.innerHTML = `<div class="step">Highlighted: <strong>${names[rel]} angles</strong> (∠${HI[0]} and ∠${HI[1]})</div><div class="step">${sumTxt}</div>`;
    }
    [baseAngle].forEach(x=>x.addEventListener('input',drawTransversal));
    relSel.addEventListener('change',drawTransversal);
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Angle 1'),baseAngle),
      el('div',{class:'field'},el('label',{},'Highlight'),relSel)
    ));
    wrap.appendChild(relRes);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg2));

    container.appendChild(wrap);
    drawTriangle();
    drawTransversal();
  }
},

] },
{ name: "Third Term", topics: [

{
  id:"trig",
  title:"Trigonometric Ratios",
  summary:"In a right-angled triangle, the ratios of the sides define sine, cosine and tangent — the foundation for solving triangles and later, 3-D problems.",
  terms:[
    {t:"Hypotenuse", d:"The longest side of a right-angled triangle, opposite the right angle."},
    {t:"Opposite side", d:"The side opposite the angle being considered."},
    {t:"Adjacent side", d:"The side next to the angle being considered (not the hypotenuse)."},
    {t:"Sine (sin)", d:"sin θ = opposite / hypotenuse"},
    {t:"Cosine (cos)", d:"cos θ = adjacent / hypotenuse"},
    {t:"Tangent (tan)", d:"tan θ = opposite / adjacent"},
    {t:"Angle of elevation/depression", d:"The angle above/below the horizontal when looking up/down at an object — common in word problems."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Trigonometry connects the angles of a right-angled triangle to the lengths of its sides. That's really it! Once you know one angle and one side, you can find EVERYTHING else about that triangle.</p>
<p>There's a famous memory trick: <strong>SOH-CAH-TOA</strong>.</p>
<ul>
<li><strong>SOH</strong> — Sine = Opposite ÷ Hypotenuse</li>
<li><strong>CAH</strong> — Cosine = Adjacent ÷ Hypotenuse</li>
<li><strong>TOA</strong> — Tangent = Opposite ÷ Adjacent</li>
</ul>
<p>The hypotenuse is always the longest side (facing the right angle). "Opposite" and "adjacent" just depend on which angle you're looking from.</p></div>
<div class="example"><div class="ex-label">Example 1 — Finding a missing side</div>
<p>A triangle has a hypotenuse of 10cm and an angle of 30°. Find the opposite side.</p>
<p class="mono">sin 30° = opposite ÷ 10<br>opposite = 10 × sin 30° = 10 × 0.5 = <strong>5 cm</strong></p></div>
<div class="example"><div class="ex-label">Example 2 — Finding a missing angle</div>
<p>A triangle has an opposite side of 7cm and an adjacent side of 7cm. Find the angle.</p>
<p class="mono">tan θ = 7 ÷ 7 = 1<br>θ = tan⁻¹(1) = <strong>45°</strong></p></div>
<div class="example"><div class="ex-label">Real-life example — how tall is that tree?</div>
<p>You stand 20m from a tree. Looking up at the top, the angle is 35°. How tall is the tree?</p>
<p class="mono">tan 35° = height ÷ 20<br>height = 20 × tan 35° ≈ <strong>14 metres</strong></p>
<p>That's how surveyors measure tall things without climbing them!</p></div>
`,
  quiz:[{"q": "sin θ = ?", "options": ["Opposite/Hypotenuse", "Adjacent/Hypotenuse", "Opposite/Adjacent", "Hypotenuse/Opposite"], "correct": 0, "explain": "That is the definition of sine."}, {"q": "The hypotenuse is:", "options": ["the longest side, opposite the right angle", "the shortest side", "adjacent to angle θ", "always horizontal"], "correct": 0, "explain": "It is always the side facing the 90° angle."}, {"q": "hyp=10, angle=30°. Opposite side = ?", "options": ["5", "8.66", "10", "3"], "correct": 0, "explain": "10×sin30°=10×0.5=5."}, {"q": "tan θ = ?", "options": ["Opposite/Adjacent", "Adjacent/Opposite", "Opposite/Hypotenuse", "Hypotenuse/Adjacent"], "correct": 0, "explain": "That is the definition of tangent."}, {"q": "cos θ = ?", "options": ["Adjacent/Hypotenuse", "Opposite/Hypotenuse", "Opposite/Adjacent", "Hypotenuse/Adjacent"], "correct": 0, "explain": "That is the definition of cosine."}, {"q": "Opposite=7, Adjacent=7. Angle θ = ?", "options": ["45°", "30°", "60°", "90°"], "correct": 0, "explain": "tanθ=1 gives θ=45°."}, {"q": "Distance 20m, angle of elevation 35°. Height ≈ ?", "options": ["14.0m", "11.5m", "17.2m", "20m"], "correct": 0, "explain": "20×tan35°≈14.0."}, {"q": "SOH-CAH-TOA helps you remember:", "options": ["the three trig ratios", "the angle sum of a triangle", "circle theorems", "index laws"], "correct": 0, "explain": "It is a mnemonic for sin, cos, tan."}, {"q": "If the angle increases toward 90°, tan θ:", "options": ["increases toward infinity", "decreases to 0", "stays the same", "becomes negative"], "correct": 0, "explain": "The adjacent side shrinks toward 0, making the ratio grow very large."}, {"q": "An angle measured downward from the horizontal is called an angle of:", "options": ["depression", "elevation", "incidence", "reflection"], "correct": 0, "explain": "Looking down gives an angle of depression."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'Right-Triangle Solver'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Enter one angle and one side — the other sides and angle are calculated, with a live diagram.'));
    const angIn = el('input',{type:'number',value:'30',min:'1',max:'89'});
    const sideSel = el('select',{}, el('option',{value:'hyp'},'Hypotenuse'), el('option',{value:'opp'},'Opposite'), el('option',{value:'adj'},'Adjacent'));
    const sideVal = el('input',{type:'number',value:'10'});
    const res = el('div',{class:'result-box'});
    const svg = mkSVG(320,240);
    function calc(){
      const theta = parseFloat(angIn.value)*Math.PI/180;
      const val = parseFloat(sideVal.value);
      let hyp,opp,adj;
      if(sideSel.value==='hyp'){ hyp=val; opp=hyp*Math.sin(theta); adj=hyp*Math.cos(theta); }
      else if(sideSel.value==='opp'){ opp=val; hyp=opp/Math.sin(theta); adj=hyp*Math.cos(theta); }
      else { adj=val; hyp=adj/Math.cos(theta); opp=hyp*Math.sin(theta); }
      res.innerHTML = `<div class="step">Hypotenuse = <strong>${fmtNum(hyp,3)}</strong></div>
      <div class="step">Opposite = <strong>${fmtNum(opp,3)}</strong></div>
      <div class="step">Adjacent = <strong>${fmtNum(adj,3)}</strong></div>
      <div class="step">Other angle = <span class="big">${fmtNum(90-parseFloat(angIn.value),2)}°</span></div>`;
      // draw
      svg.innerHTML='';
      const bx=40,by=200, scale = 220/Math.max(adj,opp,hyp,1);
      const ax = bx+adj*scale, ay=by;
      const tx = bx, ty = by-opp*scale;
      svg.appendChild(svgEl('polygon',{points:`${bx},${by} ${ax},${ay} ${tx},${ty}`, fill:'#FFFDF7', stroke:'#16233F','stroke-width':2}));
      svg.appendChild(svgEl('rect',{x:bx,y:by-12,width:12,height:12,fill:'none',stroke:'#8892a8'}));
      svg.appendChild(el2(bx-10,by+16,'#16233F','θ')); 
      svg.appendChild(el2((bx+ax)/2,by+16,'#0F6E64','adj = '+fmtNum(adj,2)));
      svg.appendChild(el2(bx-42,(by+ty)/2,'#B3401E','opp = '+fmtNum(opp,2)));
      svg.appendChild(el2((ax+tx)/2+10,(ay+ty)/2-6,'#D8A11E','hyp = '+fmtNum(hyp,2)));
      const angText = el2(bx+22,by-14,'#16233F', angIn.value+'°'); svg.appendChild(angText);
    }
    function el2(x,y,fill,txt){ const t=svgEl('text',{x,y,'font-size':11,fill,'font-weight':'600'}); t.textContent=txt; return t; }
    [angIn,sideSel,sideVal].forEach(x=>x.addEventListener('input',calc));
    sideSel.addEventListener('change',calc);
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Angle θ (°)'),angIn),
      el('div',{class:'field'},el('label',{},'Known side'),sideSel),
      el('div',{class:'field'},el('label',{},'Length (cm)'),sideVal)
    ));
    wrap.appendChild(res);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg));
    container.appendChild(wrap);
    calc();
  }
},


{
  id:"circles",
  title:"Properties of Circles",
  summary:"Circles have special angle relationships: the angle at the centre, angles in the same segment, cyclic quadrilaterals, and tangents — all provable and testable with the tools below.",
  terms:[
    {t:"Chord", d:"A straight line joining two points on a circle."},
    {t:"Tangent", d:"A straight line that touches a circle at exactly one point, always perpendicular to the radius at that point."},
    {t:"Cyclic quadrilateral", d:"A four-sided shape whose vertices all lie on a circle."},
    {t:"Segment", d:"The region between a chord and the arc it cuts off."},
    {t:"Subtend", d:"An angle is 'subtended' by a chord/arc when its arms pass through the two endpoints of that chord/arc."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Circles have a few surprising, always-true patterns. Picture a circle with two fixed points on its edge, A and B. Now stand anywhere else on the edge and look at both A and B — the angle you see stays exactly the same, no matter where you stand, as long as you're on the same side!</p>
<p>Stand at the very centre instead, and your angle will always be exactly DOUBLE what it was on the edge. These patterns aren't luck — they can be proven, and they let you solve circle problems fast, without a protractor.</p></div>
<div class="example"><div class="ex-label">Example 1 — Angle at the centre vs the edge</div>
<p>An arc makes a 50° angle when viewed from the edge of the circle. What angle does it make from the centre?</p>
<p class="mono">Angle at centre = 2 × 50° = <strong>100°</strong></p></div>
<div class="example"><div class="ex-label">Example 2 — Cyclic Quadrilateral (a 4-sided shape inside a circle)</div>
<p>If all 4 corners of a shape touch the circle, opposite corners always add up to 180°.</p>
<p class="mono">One angle is 110° → its opposite angle = 180 − 110 = <strong>70°</strong></p></div>
<div class="example"><div class="ex-label">Example 3 — Tangent lines</div>
<p>A tangent is a straight line that just "kisses" the circle at one point, without cutting through it. Wherever it touches, it always meets the radius at a perfect <strong>90°</strong> angle.</p></div>
`,
  quiz:[{"q": "The angle at the centre is ___ the angle at the circumference (same arc).", "options": ["twice", "half", "equal to", "unrelated to"], "correct": 0, "explain": "The centre angle is always double the circumference angle."}, {"q": "Angles in the same segment, subtended by the same arc, are:", "options": ["equal", "supplementary", "always 90°", "always different"], "correct": 0, "explain": "They are always equal."}, {"q": "Opposite angles in a cyclic quadrilateral sum to:", "options": ["180°", "90°", "360°", "270°"], "correct": 0, "explain": "This is the cyclic quadrilateral theorem."}, {"q": "A tangent meets the radius at the point of contact at:", "options": ["90°", "180°", "45°", "60°"], "correct": 0, "explain": "A tangent is always perpendicular to the radius there."}, {"q": "A chord is:", "options": ["a straight line joining two points on a circle", "the centre of a circle", "a curved line", "the radius"], "correct": 0, "explain": "A chord connects two points on the circumference."}, {"q": "An arc subtends 50° at the circumference. The angle at the centre is:", "options": ["100°", "50°", "25°", "150°"], "correct": 0, "explain": "Double the circumference angle."}, {"q": "A cyclic quadrilateral has one angle of 110°. Its opposite angle is:", "options": ["70°", "110°", "90°", "180°"], "correct": 0, "explain": "180−110=70."}, {"q": "A quadrilateral is \"cyclic\" if:", "options": ["all four vertices lie on a circle", "it has four equal sides", "it has a right angle", "it is a square"], "correct": 0, "explain": "That is the definition of cyclic."}, {"q": "The region between a chord and the arc it cuts off is called a:", "options": ["segment", "sector", "tangent", "radius"], "correct": 0, "explain": "A segment is bounded by a chord and an arc."}, {"q": "\"Subtend\" means:", "options": ["an angle formed by lines from two points to a third point", "to touch a circle at one point", "to divide a circle in half", "to measure a radius"], "correct": 0, "explain": "An arc/chord subtends an angle at a point."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'1. Angle at Centre vs Circumference'));
    wrap.appendChild(el('div',{class:'sim-hint'},'Drag the slider to move the point on the circumference — the centre angle always stays double the circumference angle for the same arc.'));
    const posSlider = el('input',{type:'range',min:'10',max:'170',value:'100'});
    const svg1 = mkSVG(300,260);
    const res1 = el('div',{class:'result-box'});
    function drawCentre(){
      svg1.innerHTML='';
      const cx=150,cy=140,r=95;
      svg1.appendChild(svgEl('circle',{cx,cy,r,fill:'none',stroke:'#16233F','stroke-width':2}));
      const aA = Math.PI*0.75, aB = Math.PI*0.25; // fixed arc endpoints
      const A = {x:cx+r*Math.cos(aA), y:cy+r*Math.sin(aA)};
      const B = {x:cx+r*Math.cos(aB), y:cy+r*Math.sin(aB)};
      const t = parseFloat(posSlider.value); // degrees position for P, between B and A the long way (bottom)
      const aP = (Math.PI*0.25) + (t/180)*(Math.PI*1.5); // sweeps around bottom arc
      const P = {x:cx+r*Math.cos(aP), y:cy+r*Math.sin(aP)};
      svg1.appendChild(svgEl('line',{x1:cx,y1:cy,x2:A.x,y2:A.y,stroke:'#B3401E','stroke-width':1.5}));
      svg1.appendChild(svgEl('line',{x1:cx,y1:cy,x2:B.x,y2:B.y,stroke:'#B3401E','stroke-width':1.5}));
      svg1.appendChild(svgEl('line',{x1:P.x,y1:P.y,x2:A.x,y2:A.y,stroke:'#0F6E64','stroke-width':1.5}));
      svg1.appendChild(svgEl('line',{x1:P.x,y1:P.y,x2:B.x,y2:B.y,stroke:'#0F6E64','stroke-width':1.5}));
      svg1.appendChild(svgEl('circle',{cx:A.x,cy:A.y,r:3,fill:'#B3401E'}));
      svg1.appendChild(svgEl('circle',{cx:B.x,cy:B.y,r:3,fill:'#B3401E'}));
      svg1.appendChild(svgEl('circle',{cx:P.x,cy:P.y,r:3,fill:'#0F6E64'}));
      svg1.appendChild(svgEl('circle',{cx,cy,r:3,fill:'#16233F'}));
      function angleBetween(v1,v2){
        const dot = v1.x*v2.x+v1.y*v2.y;
        const m1=Math.hypot(v1.x,v1.y), m2=Math.hypot(v2.x,v2.y);
        return Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2))))*180/Math.PI;
      }
      const centreAngle = angleBetween({x:A.x-cx,y:A.y-cy},{x:B.x-cx,y:B.y-cy});
      const circAngle = angleBetween({x:A.x-P.x,y:A.y-P.y},{x:B.x-P.x,y:B.y-P.y});
      res1.innerHTML = `<div class="step">Angle at centre (∠AOB) = <strong>${fmtNum(centreAngle,1)}°</strong></div>
      <div class="step">Angle at circumference (∠APB) = <strong>${fmtNum(circAngle,1)}°</strong></div>
      <div class="step">Ratio: ${fmtNum(centreAngle,1)} / ${fmtNum(circAngle,1)} ≈ <span class="big">${fmtNum(centreAngle/circAngle,2)}</span> (should be ≈2)</div>`;
    }
    posSlider.addEventListener('input',drawCentre);
    wrap.appendChild(el('div',{class:'controls'},el('div',{class:'field'},el('label',{},'Move point P'),posSlider)));
    wrap.appendChild(res1);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg1));

    wrap.appendChild(el('div',{style:'height:22px'}));
    wrap.appendChild(el('div',{},el('strong',{},'2. Cyclic Quadrilateral')));
    wrap.appendChild(el('div',{class:'sim-hint'},'Set one angle of a cyclic quadrilateral; its opposite angle is calculated to complete 180°.'));
    const cq1 = el('input',{type:'range',min:'20',max:'160',value:'80'});
    const res2 = el('div',{class:'result-box'});
    const svg2 = mkSVG(280,240);
    function drawCyclic(){
      const A = parseFloat(cq1.value);
      const C = 180-A;
      svg2.innerHTML='';
      const cx=140,cy=120,r=95;
      svg2.appendChild(svgEl('circle',{cx,cy,r,fill:'none',stroke:'#16233F','stroke-width':2}));
      const angs=[100,190,300,20].map(d=>d*Math.PI/180);
      const pts = angs.map(a=>({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)}));
      svg2.appendChild(svgEl('polygon',{points:pts.map(p=>p.x+','+p.y).join(' '), fill:'none', stroke:'#0F6E64','stroke-width':2}));
      const labels=['A','B','C','D'];
      pts.forEach((p,i)=>{
        svg2.appendChild(svgEl('circle',{cx:p.x,cy:p.y,r:3,fill:'#B3401E'}));
        const t=svgEl('text',{x:p.x+(p.x>cx?8:-16),y:p.y+(p.y>cy?14:-6),'font-size':12,fill:'#16233F','font-weight':'700'});
        t.textContent=labels[i]; svg2.appendChild(t);
      });
      const tA=svgEl('text',{x:pts[0].x-8,y:pts[0].y-14,'font-size':12,fill:'#0F6E64','font-weight':'700'}); tA.textContent=fmtNum(A,0)+'°'; svg2.appendChild(tA);
      const tC=svgEl('text',{x:pts[2].x-8,y:pts[2].y+22,'font-size':12,fill:'#0F6E64','font-weight':'700'}); tC.textContent=fmtNum(C,0)+'°'; svg2.appendChild(tC);
      res2.innerHTML = `<div class="step">∠A = ${fmtNum(A,0)}°, opposite ∠C = 180° − ${fmtNum(A,0)}° = <span class="big">${fmtNum(C,0)}°</span></div><div class="step">∠A + ∠C = <strong>180°</strong> ✓ (same holds for ∠B + ∠D)</div>`;
    }
    cq1.addEventListener('input',drawCyclic);
    wrap.appendChild(el('div',{class:'controls'},el('div',{class:'field'},el('label',{},'Angle A'),cq1)));
    wrap.appendChild(res2);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg2));

    container.appendChild(wrap);
    drawCentre(); drawCyclic();
  }
},


{
  id:"statistics",
  title:"Statistics",
  summary:"Statistics is about collecting, organising, and summarising data — using tables and charts to present it, and using mean, median and mode to describe its 'centre'.",
  terms:[
    {t:"Data", d:"Information collected, often as numbers, for analysis."},
    {t:"Frequency", d:"How many times a value or class of values occurs in a data set."},
    {t:"Mean", d:"The arithmetic average: sum of values ÷ number of values."},
    {t:"Median", d:"The middle value when data is arranged in order (or the average of the two middle values)."},
    {t:"Mode", d:"The value(s) that occur most frequently."},
    {t:"Class interval", d:"A range of values used to group continuous data, e.g. 10–19, 20–29."},
    {t:"Class midpoint", d:"The middle value of a class interval, used to estimate the mean of grouped data."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Statistics is just about making sense of a pile of numbers. First you collect them. Then you organise them into a table or chart so patterns are easy to spot. Finally, you find one "typical" number to sum it all up.</p>
<ul>
<li><strong>Mean</strong> — the everyday average. Add everything up, divide by how many numbers there are.</li>
<li><strong>Median</strong> — line up all the numbers from smallest to biggest, and pick the one right in the middle.</li>
<li><strong>Mode</strong> — whichever number shows up the most times.</li>
</ul></div>
<div class="example"><div class="ex-label">Example 1 — Finding all three at once</div>
<p>Data: 4, 8, 6, 5, 8, 9, 8, 7</p>
<p class="mono">Mean = (4+8+6+5+8+9+8+7) ÷ 8 = 55 ÷ 8 = <strong>6.875</strong><br>Sorted: 4,5,6,7,8,8,8,9 → Median = (7+8)÷2 = <strong>7.5</strong><br>Mode = <strong>8</strong> (it appears 3 times — more than any other number)</p></div>
<div class="example"><div class="ex-label">Example 2 — Why median can be fairer than mean</div>
<p>Five workers earn (in thousands): 20, 22, 21, 23, 150. That one huge salary drags the mean way up to 47.2 — which doesn't really describe anyone! The median (22) gives a much fairer "typical" picture.</p></div>
<div class="example"><div class="ex-label">Example 3 — Grouped data (data sorted into ranges)</div>
<p>When data is grouped into ranges (like ages 10-19, 20-29...), we use the middle number of each range (the "midpoint") to estimate the mean.</p>
<p class="mono">Estimated Mean = Σ(frequency × midpoint) ÷ Σ(frequency)</p></div>
`,
  quiz:[{"q": "The mean is calculated by:", "options": ["sum of values ÷ number of values", "the middle value", "the most frequent value", "the largest value"], "correct": 0, "explain": "That is the definition of the arithmetic mean."}, {"q": "Median of 3,5,7,9,11 is:", "options": ["7", "5", "9", "6"], "correct": 0, "explain": "It is already sorted, and 7 is the middle value."}, {"q": "The mode is:", "options": ["the most frequently occurring value", "the average", "the middle value", "the range"], "correct": 0, "explain": "Mode = the most common value."}, {"q": "In grouped data, the mean is estimated using:", "options": ["class midpoints", "class boundaries only", "the mode", "the median class"], "correct": 0, "explain": "Midpoints represent each class in the calculation."}, {"q": "A histogram is typically used for:", "options": ["continuous grouped data", "categorical data only", "single data points", "none of the above"], "correct": 0, "explain": "Histograms show continuous grouped frequency data."}, {"q": "Salaries 20,22,21,23,150 (thousands). The median is:", "options": ["22", "47.2", "21", "150"], "correct": 0, "explain": "Sorted: 20,21,22,23,150 — middle value is 22."}, {"q": "Which measure is least affected by one very extreme value?", "options": ["Median", "Mean", "Range", "Sum"], "correct": 0, "explain": "The median only depends on order, not size of extremes."}, {"q": "The class with the highest frequency is called the:", "options": ["modal class", "mean class", "median class", "range class"], "correct": 0, "explain": "That is the definition of the modal class."}, {"q": "If a data set has two values tied for most frequent, it is called:", "options": ["bimodal", "unimodal", "non-modal", "trimodal"], "correct": 0, "explain": "Two modes means the data is bimodal."}, {"q": "Frequency means:", "options": ["how many times a value occurs", "the average value", "the biggest value", "the range of values"], "correct": 0, "explain": "Frequency counts occurrences."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'1. Ungrouped Data — Mean, Median, Mode'));
    const dataIn = el('textarea',{rows:2,style:'width:100%;min-width:260px;',},'4, 8, 6, 5, 8, 9, 8, 7');
    const res1 = el('div',{class:'result-box'});
    const svg1 = mkSVG(440,240);
    function calc1(){
      const nums = dataIn.value.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n));
      if(!nums.length){ res1.innerHTML='<span class="warn">Enter comma-separated numbers.</span>'; return; }
      const sum = nums.reduce((a,b)=>a+b,0);
      const mean = sum/nums.length;
      const sorted = [...nums].sort((a,b)=>a-b);
      const mid = Math.floor(sorted.length/2);
      const median = sorted.length%2 ? sorted[mid] : (sorted[mid-1]+sorted[mid])/2;
      const freq = {};
      nums.forEach(n=>freq[n]=(freq[n]||0)+1);
      const maxF = Math.max(...Object.values(freq));
      const modes = Object.keys(freq).filter(k=>freq[k]===maxF).map(Number);
      const modeStr = maxF===1 ? 'no mode (all values unique)' : modes.join(', ');
      res1.innerHTML = `<div class="step">n = ${nums.length}, Σx = ${sum}</div>
      <div class="step">Mean = ${sum}/${nums.length} = <span class="big">${fmtNum(mean,3)}</span></div>
      <div class="step">Sorted: ${sorted.join(', ')}</div>
      <div class="step">Median = <span class="big">${fmtNum(median,3)}</span></div>
      <div class="step">Mode = <span class="big">${modeStr}</span></div>`;
      const chartData = Object.keys(freq).sort((a,b)=>a-b).map(k=>({label:k,value:freq[k]}));
      drawBarChart(svg1, chartData, {color:'#0F6E64'});
    }
    dataIn.addEventListener('input',calc1);
    wrap.appendChild(el('div',{class:'controls'},el('div',{class:'field',style:'flex:1'},el('label',{},'Data (comma-separated)'),dataIn)));
    wrap.appendChild(res1);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg1));

    wrap.appendChild(el('div',{style:'height:22px'}));
    wrap.appendChild(el('div',{},el('strong',{},'2. Grouped Data — Estimated Mean')));
    wrap.appendChild(el('div',{class:'sim-hint'},'Enter class intervals and frequencies, one per line, as "low-high, frequency" e.g. "10-19, 4"'));
    const groupIn = el('textarea',{rows:5,style:'width:100%;min-width:260px;'},'10-19, 4\n20-29, 9\n30-39, 12\n40-49, 7\n50-59, 3');
    const res2 = el('div',{class:'result-box'});
    const svg2 = mkSVG(440,240);
    function calc2(){
      const lines = groupIn.value.split('\n').map(l=>l.trim()).filter(l=>l.length);
      const rows = [];
      for(const line of lines){
        const m = line.match(/(\d+(?:\.\d+)?)\s*-\s*(\d+(?:\.\d+)?)\s*,\s*(\d+(?:\.\d+)?)/);
        if(!m) continue;
        const lo=parseFloat(m[1]), hi=parseFloat(m[2]), f=parseFloat(m[3]);
        rows.push({lo,hi,f,mid:(lo+hi)/2});
      }
      if(!rows.length){ res2.innerHTML='<span class="warn">Format each line as: low-high, frequency</span>'; return; }
      const sumF = rows.reduce((a,r)=>a+r.f,0);
      const sumFX = rows.reduce((a,r)=>a+r.f*r.mid,0);
      const mean = sumFX/sumF;
      const maxRow = rows.reduce((a,r)=>r.f>a.f?r:a, rows[0]);
      let tableHTML = '<table class="datatable"><tr><th>Class</th><th>f</th><th>Midpoint</th><th>f×midpoint</th></tr>';
      rows.forEach(r=>tableHTML+=`<tr><td>${r.lo}-${r.hi}</td><td>${r.f}</td><td>${r.mid}</td><td>${fmtNum(r.f*r.mid,1)}</td></tr>`);
      tableHTML += '</table>';
      res2.innerHTML = `${tableHTML}<div class="step" style="margin-top:8px;">Σf = ${sumF}, Σ(f×midpoint) = ${fmtNum(sumFX,1)}</div>
      <div class="step">Estimated Mean = ${fmtNum(sumFX,1)}/${sumF} = <span class="big">${fmtNum(mean,3)}</span></div>
      <div class="step">Modal class = <strong>${maxRow.lo}-${maxRow.hi}</strong> (highest frequency, ${maxRow.f})</div>`;
      drawBarChart(svg2, rows.map(r=>({label:r.lo+'-'+r.hi, value:r.f})), {color:'#B3401E'});
    }
    groupIn.addEventListener('input',calc2);
    wrap.appendChild(el('div',{class:'controls'},el('div',{class:'field',style:'flex:1'},el('label',{},'Class, frequency (one per line)'),groupIn)));
    wrap.appendChild(res2);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg2));

    container.appendChild(wrap);
    calc1(); calc2();
  }
},


{
  id:"probability",
  title:"Probability",
  summary:"Probability measures how likely an event is, from 0 (impossible) to 1 (certain). Learn to calculate theoretical probability and compare it with experimental results from real trials.",
  terms:[
    {t:"Experiment / trial", d:"An action with an uncertain outcome, e.g. tossing a coin or rolling a die."},
    {t:"Sample space", d:"The set of all possible outcomes of an experiment, e.g. {1,2,3,4,5,6} for a die."},
    {t:"Event", d:"A particular outcome or set of outcomes we are interested in, e.g. 'rolling an even number'."},
    {t:"Theoretical probability", d:"P(event) = number of favourable outcomes ÷ total number of possible outcomes."},
    {t:"Experimental probability", d:"The proportion of times an event actually occurred when the experiment was repeated."}
  ],
  content:`
<div class="plain-explain"><div class="ex-label">Let's Break It Down</div>
<p>Probability just gives a number to "how likely" something is. The scale runs from 0 to 1:</p>
<ul>
<li><strong>0</strong> = impossible (like rolling a 7 on a normal die)</li>
<li><strong>1</strong> = certain (like the sun rising tomorrow)</li>
<li>Anything in between (like 0.5) means "could go either way"</li>
</ul>
<p>To work it out, just count what you want, and divide by everything that could happen:</p>
<p class="mono">P(event) = favourable outcomes ÷ total possible outcomes</p></div>
<div class="example"><div class="ex-label">Example 1 — Rolling a die</div>
<p>What is the probability of rolling an even number on a normal die?</p>
<p class="mono">Total outcomes: {1,2,3,4,5,6} → 6 outcomes<br>Favourable outcomes: {2,4,6} → 3 outcomes<br>P(even) = 3/6 = <strong>1/2</strong></p></div>
<div class="example"><div class="ex-label">Example 2 — Drawing a card</div>
<p>What is the probability of drawing a King from a normal deck of 52 cards?</p>
<p class="mono">4 Kings out of 52 cards<br>P(King) = 4/52 = <strong>1/13</strong></p></div>
<div class="example"><div class="ex-label">Example 3 — Tossing two coins</div>
<p>What is the probability that BOTH coins land on Heads?</p>
<p class="mono">All possible outcomes: {HH, HT, TH, TT} → 4 outcomes<br>Favourable: {HH} → 1 outcome<br>P(both Heads) = <strong>1/4</strong></p></div>
<div class="example"><div class="ex-label">Theory vs reality</div>
<p>If you toss a coin just 5 times, you might get 4 Heads and 1 Tail — that's normal! But toss it 1000 times, and you'll get very close to 500-500. The more times you try, the closer your results get to what theory predicts.</p></div>
`,
  quiz:[{"q": "P(event) is calculated as:", "options": ["favourable outcomes ÷ total outcomes", "total ÷ favourable", "favourable × total", "favourable − total"], "correct": 0, "explain": "That is the definition of theoretical probability."}, {"q": "The probability of an impossible event is:", "options": ["0", "1", "0.5", "undefined"], "correct": 0, "explain": "Impossible events have probability 0."}, {"q": "The probability of a certain event is:", "options": ["1", "0", "0.5", "100"], "correct": 0, "explain": "Certain events have probability 1."}, {"q": "Rolling a fair die, P(getting a 6) = ?", "options": ["1/6", "1/2", "1/3", "6"], "correct": 0, "explain": "1 favourable outcome out of 6 possible."}, {"q": "As trials increase, experimental probability tends to:", "options": ["get closer to the theoretical probability", "move away from it", "stay random", "become exactly 1"], "correct": 0, "explain": "This is the law of large numbers."}, {"q": "Drawing from a 52-card deck, P(King) = ?", "options": ["1/13", "1/52", "4/13", "1/4"], "correct": 0, "explain": "4 kings / 52 cards simplifies to 1/13."}, {"q": "Two coins tossed. P(both Heads) = ?", "options": ["1/4", "1/2", "1/3", "2/4"], "correct": 0, "explain": "Only 1 of the 4 equally-likely outcomes is HH."}, {"q": "The sample space for tossing one coin is:", "options": ["{Heads, Tails}", "{1,2,3,4,5,6}", "{Heads}", "{0,1}"], "correct": 0, "explain": "A coin has exactly two possible outcomes."}, {"q": "An \"event\" in probability is:", "options": ["a particular outcome or set of outcomes", "the total number of trials", "always a certainty", "a physical object"], "correct": 0, "explain": "An event is the outcome(s) we are interested in."}, {"q": "Probability values always lie:", "options": ["between 0 and 1 inclusive", "between −1 and 1", "above 1", "below 0"], "correct": 0, "explain": "Probability is bounded between impossible (0) and certain (1)."}],
  sim(container){
    const wrap = el('div',{});
    wrap.appendChild(el('h4',{},'1. Theoretical Probability Calculator'));
    const favIn = el('input',{type:'number',value:'3',min:'0'});
    const totIn = el('input',{type:'number',value:'6',min:'1'});
    const res1 = el('div',{class:'result-box'});
    function calc1(){
      const f=parseFloat(favIn.value), t=parseFloat(totIn.value);
      if(!t || f<0 || f>t){ res1.innerHTML='<span class="warn">Favourable outcomes must be between 0 and total.</span>'; return; }
      const g = gcd(f,t)||1;
      res1.innerHTML = `<div class="step">P(event) = ${f}/${t}${g>1?` = ${f/g}/${t/g}`:''} = <span class="big">${fmtNum(f/t,4)}</span></div>`;
    }
    [favIn,totIn].forEach(x=>x.addEventListener('input',calc1));
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Favourable outcomes'),favIn),
      el('div',{class:'field'},el('label',{},'Total outcomes'),totIn)
    ));
    wrap.appendChild(res1);

    wrap.appendChild(el('div',{style:'height:22px'}));
    wrap.appendChild(el('div',{},el('strong',{},'2. Experimental Simulator — Theoretical vs Experimental')));
    wrap.appendChild(el('div',{class:'sim-hint'},'Run many trials of a coin toss or die roll and watch the experimental probability approach the theoretical value.'));
    const expSel = el('select',{}, el('option',{value:'coin'},'Coin toss (P(Heads))'), el('option',{value:'die'},'Die roll (P(rolling a 6))'));
    const trialsIn = el('input',{type:'number',value:'100',min:'1',max:'20000'});
    const res2 = el('div',{class:'result-box'});
    const svg2 = mkSVG(420,220);
    function runSim(){
      const trials = Math.max(1,Math.min(20000,parseInt(trialsIn.value)||100));
      let hits=0; const outcomes={};
      const isCoin = expSel.value==='coin';
      for(let i=0;i<trials;i++){
        if(isCoin){
          const r = Math.random()<0.5?'Heads':'Tails';
          outcomes[r]=(outcomes[r]||0)+1;
          if(r==='Heads') hits++;
        } else {
          const r = 1+Math.floor(Math.random()*6);
          outcomes[r]=(outcomes[r]||0)+1;
          if(r===6) hits++;
        }
      }
      const theo = isCoin? 0.5 : (1/6);
      const exp = hits/trials;
      res2.innerHTML = `<div class="step">Trials run: <strong>${trials}</strong></div>
      <div class="step">Theoretical probability = <strong>${fmtNum(theo,4)}</strong></div>
      <div class="step">Experimental probability = ${hits}/${trials} = <span class="big">${fmtNum(exp,4)}</span></div>
      <div class="step">Difference from theoretical = ${fmtNum(Math.abs(exp-theo),4)}</div>`;
      const labels = isCoin? ['Heads','Tails'] : [1,2,3,4,5,6];
      const chartData = labels.map(l=>({label:String(l), value:outcomes[l]||0}));
      drawBarChart(svg2, chartData, {color: isCoin? '#0F6E64':'#D8A11E'});
    }
    const runBtn = el('button',{class:'btn',onclick:runSim},'Run Simulation');
    wrap.appendChild(el('div',{class:'controls'},
      el('div',{class:'field'},el('label',{},'Experiment'),expSel),
      el('div',{class:'field'},el('label',{},'Number of trials'),trialsIn),
      runBtn
    ));
    wrap.appendChild(res2);
    wrap.appendChild(el('div',{style:'display:flex;justify-content:center;margin-top:10px;'},svg2));

    container.appendChild(wrap);
    calc1(); runSim();
  }
},

] }
];

/* ============================================================
   APP LOGIC — sidebar, navigation, rendering
   ============================================================ */
const termTabsEl = document.getElementById('term-tabs');
const topicListEl = document.getElementById('topic-list');
const pageEl = document.getElementById('page');

let currentTermIdx = 0;
let currentTopicId = TERMS[0].topics[0].id;

function flatTopicIndex(){
  const flat = [];
  TERMS.forEach((term,ti)=>term.topics.forEach((top,pi)=>flat.push({termIdx:ti, topic:top})));
  return flat;
}

function renderTermTabs(){
  termTabsEl.innerHTML = '';
  TERMS.forEach((term,i)=>{
    const btn = el('button',{class:'term-tab'+(i===currentTermIdx?' active':''), onclick:()=>{
      currentTermIdx = i;
      currentTopicId = TERMS[i].topics[0].id;
      renderTermTabs(); renderTopicList(); renderPage();
    }}, term.name);
    termTabsEl.appendChild(btn);
  });
}

function renderTopicList(){
  topicListEl.innerHTML = '';
  TERMS[currentTermIdx].topics.forEach((top,i)=>{
    const li = el('li',{});
    const btn = el('button',{class:'topic-btn'+(top.id===currentTopicId?' active':''), onclick:()=>{
      currentTopicId = top.id;
      renderTopicList(); renderPage();
      window.scrollTo(0,0);
    }},
      el('span',{class:'num'}, (currentTermIdx+1)+'.'+(i+1)),
      el('span',{}, top.title)
    );
    li.appendChild(btn);
    topicListEl.appendChild(li);
  });
}

function findTopic(id){
  for(const term of TERMS) for(const top of term.topics) if(top.id===id) return top;
  return null;
}

function renderPage(){
  const topic = findTopic(currentTopicId);
  pageEl.innerHTML = '';
  const termName = TERMS[currentTermIdx].name;
  const idxInTerm = TERMS[currentTermIdx].topics.findIndex(t=>t.id===topic.id);

  pageEl.appendChild(el('div',{class:'eyebrow'}, termName+' \u00B7 Topic '+(idxInTerm+1)+' of '+TERMS[currentTermIdx].topics.length));
  pageEl.appendChild(el('h2',{class:'topic-title'}, topic.title));
  pageEl.appendChild(el('div',{class:'summary'}, topic.summary));

  const glossSection = el('section',{class:'block'},
    el('h3',{class:'block-title'},'Key Terms'),
    el('dl',{class:'glossary'}, ...topic.terms.flatMap(t=>[el('dt',{},t.t), el('dd',{},t.d)]))
  );
  pageEl.appendChild(glossSection);

  const explainSection = el('section',{class:'block'},
    el('h3',{class:'block-title'},'Explanation & Worked Examples'),
    el('div',{class:'prose', html: topic.content})
  );
  pageEl.appendChild(explainSection);

  const simSection = el('section',{class:'block'},
    el('h3',{class:'block-title'},'Try It Yourself — Live Simulation'),
    el('div',{class:'sim-panel', id:'sim-'+topic.id})
  );
  pageEl.appendChild(simSection);

  const quizSection = el('section',{class:'block'},
    el('h3',{class:'block-title'},'Quick Test — 10 Questions'),
    el('div',{class:'sim-hint'},'Answer every question, then press Submit to see your score and the correct answers.'),
    el('div',{class:'sim-panel', id:'quiz-'+topic.id})
  );
  pageEl.appendChild(quizSection);

  // footer navigation
  const flat = flatTopicIndex();
  const curFlatIdx = flat.findIndex(f=>f.topic.id===topic.id);
  const prev = flat[curFlatIdx-1], next = flat[curFlatIdx+1];
  const footNav = el('div',{class:'footer-nav'},
    prev ? el('button',{onclick:()=>{currentTermIdx=prev.termIdx; currentTopicId=prev.topic.id; renderTermTabs(); renderTopicList(); renderPage(); window.scrollTo(0,0);}}, '\u2190 '+prev.topic.title) : el('span',{}),
    next ? el('button',{onclick:()=>{currentTermIdx=next.termIdx; currentTopicId=next.topic.id; renderTermTabs(); renderTopicList(); renderPage(); window.scrollTo(0,0);}}, next.topic.title+' \u2192') : el('span',{})
  );
  pageEl.appendChild(footNav);

  const siteFooter = el('div',{class:'site-footer'},
    el('div',{class:'footer-brand'}, 'SS1 General Mathematics · Interactive Workbook'),
    el('h4',{},'Built by Johnexprotec'),
    el('p',{},'This workbook was designed and built to make SS1 Mathematics simple, visual, and easy to understand — for every student, everywhere, even offline. If this helped you, please keep this credit when sharing it.'),
    el('div',{class:'footer-contacts'},
      el('a',{href:'mailto:Johnexprotec@gmail.com'}, '✉ Johnexprotec@gmail.com'),
      el('a',{href:'tel:+2348165719804'}, '☎ +234 816 571 9804'),
      el('a',{href:'https://wa.me/2348165719804', target:'_blank', rel:'noopener'}, '💬 WhatsApp: +234 816 571 9804'),
      el('a',{href:'https://instagram.com/Johnexprotec', target:'_blank', rel:'noopener'}, '@Johnexprotec — all social media')
    ),
    el('div',{class:'footer-note'}, '© '+new Date().getFullYear()+' Johnexprotec. All rights reserved. Please do not remove or alter this credit when copying or sharing this workbook.')
  );
  pageEl.appendChild(siteFooter);

  // run the interactive simulation for this topic
  const simContainer = document.getElementById('sim-'+topic.id);
  try{
    topic.sim(simContainer);
  } catch(e){
    simContainer.innerHTML = '<span class="warn">Simulation failed to load: '+e.message+'</span>';
    console.error(e);
  }

  // render the quiz for this topic
  const quizContainer = document.getElementById('quiz-'+topic.id);
  quizContainer.id = 'quiz-'+topic.id;
  try{
    renderQuiz(quizContainer, topic.quiz);
  } catch(e){
    quizContainer.innerHTML = '<span class="warn">Quiz failed to load: '+e.message+'</span>';
    console.error(e);
  }
}

renderTermTabs();
renderTopicList();
renderPage();

</script>
